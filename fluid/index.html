<style>

/* ===== Odin 0.5: fluency practice ===== */
.flstatus { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 0.92rem; }
.flstatus > span { flex: 1 1 320px; }
.flstatus.ok { background: var(--ongrade-bg); }
.flstatus.mid { background: var(--approaching-bg); }
.flstatus.no { background: var(--support-bg); }
.fltab .schip small { font-size: 0.75em; opacity: .8; margin-left: 2px; }
.flbadges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.flbadge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.85rem; }
.flbadge b { font-weight: 600; }
.flbadge small { font-family: var(--f-mono); }
.flbadge.off { background: var(--sunk); color: var(--muted); opacity: .75; }
.flbadge.big { flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; font-size: 1rem; min-width: 110px; text-align: center; }
.flchart { max-width: 760px; }
.flline { stroke: var(--accent); stroke-width: 2; }
.flline.pre { stroke-dasharray: 5 4; opacity: .7; }
.flexam .flxclock { font-size: 1.3rem; padding: 2px 10px; border-radius: 8px; background: var(--sunk); align-self: center; }
.flsum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.95rem; }
.fllegend { display: flex; flex-wrap: wrap; gap: 8px; }
.fltext { font-size: 1.15rem; line-height: 1.9; max-width: 72ch; }
.fltext p { margin: 0 0 .6em; }
.fltext.big { font-size: 1.45rem; line-height: 2; }
.fltext.exam button.flw { font: inherit; border: 0; background: none; color: var(--ink); padding: 1px 3px; margin: 0 -1px; border-radius: 5px; cursor: pointer; }
.fltext.exam button.flw:hover { background: var(--sunk); }
.fltext.exam button.flw:focus-visible { outline: 2px solid var(--accent); }
.flw.m-x { background: var(--support-bg); color: var(--support); text-decoration: line-through; }
.flw.m-o { background: var(--support-bg); color: var(--support); text-decoration: line-through dotted; }
.flw.m-s { background: var(--approaching-bg); color: var(--approaching); text-decoration: underline; }
.flw.m-c { box-shadow: inset 0 -2px 0 var(--ongrade); }
.flw.m-u { border-bottom: 2px dotted var(--muted) !important; border-radius: 0 !important; }
.fllegend .flw { padding: 1px 6px; border-radius: 5px; }
.flw.after { color: var(--muted); }
.flw.lastw { outline: 2px solid var(--accent); }
.flprint { font-size: 15pt; line-height: 2; }
.flprint.big { font-size: 19pt; }
.flprint h2 { font-size: 18pt; margin-bottom: 10pt; }

/* the reading screen */
#fl { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--ink); overflow: auto; display: flex; flex-direction: column; }
#fl .smtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 0.95rem; color: var(--muted); }
#fl .smbody { flex: 1; display: grid; align-content: start; justify-items: center; gap: 16px; padding: 22px 16px 120px; }
#fl .smcard { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 14px; justify-items: start; box-sizing: border-box; }
#fl .smcard.wide { width: min(820px, 100%); }
#fl h2 { font-family: var(--f-display); font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2rem); line-height: 1.25; margin: 0; }
#fl p { margin: 0; }
#fl .smkind { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
#fl .smbig { font-size: 1.3rem; }
#fl .btn.big { font-size: 1.15rem; padding: 12px 26px; }
#fl .smrow { display: flex; flex-wrap: wrap; gap: 10px; }
#fl .flbest { padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); }
#fl .flmic { font-size: 1.1rem; }
#fl .flmic.warn { color: var(--support); }
#fl .flread { width: min(980px, 100%); display: grid; gap: 12px; }
#fl .flhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
#fl .flclock { font-family: var(--f-mono); font-size: 1.05rem; }
#fl .flclock #fl-clock { font-size: 1.5rem; font-weight: 700; color: var(--ink); }
#fl .flprog { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
#fl .flprog i { display: block; height: 100%; width: 0; background: var(--ongrade); transition: width .3s; }
#fl .fltext { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px; font-size: clamp(1.35rem, 1.1rem + 0.9vw, 1.75rem); line-height: 1.85; max-width: none; }
#fl .fltext.big { font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2.2rem); line-height: 2; }
#fl .flw { border-radius: 6px; padding: 0 2px; transition: background .2s, color .2s; }
#fl .practice .flw.ok { color: var(--ongrade); }
#fl .practice .flw.given { color: var(--approaching); }
#fl .practice .flw.cur { box-shadow: inset 0 -3px 0 var(--accent); }
#fl .flw.focus { background: var(--approaching-bg); color: var(--ink); outline: 3px solid var(--approaching); }
#fl .flsay { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); max-width: min(720px, calc(100% - 32px)); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 1.15rem; box-shadow: 0 6px 22px rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#fl .flsay.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#fl .fldone .flstats { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; }
#fl .flstats > div { flex: 1 1 160px; display: grid; gap: 2px; padding: 14px; border-radius: 12px; background: var(--sunk); }
#fl .flstats b { font-family: var(--f-display); font-size: 2.2rem; line-height: 1.1; }
#fl .flstats span { color: var(--muted); }
#fl .flnew { display: grid; gap: 8px; }
#fl .flgo { background: var(--ongrade); border-color: var(--ongrade); }
#fl .pin.big { font-size: 2rem; width: 6em; text-align: center; }
@media print { .flprint { font-size: 15pt; } }
/* 0.8.2: a small "Listening" sign on the reading screen; the dot grows with the student's voice */
#fl .flmicl { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
#fl .flmicl i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; transition: background .2s, box-shadow .12s; }
#fl .flmicl.ready i { background: var(--ongrade); box-shadow: 0 0 0 calc(var(--lv, 0) * 7px) color-mix(in srgb, var(--ongrade) 30%, transparent); }
#fl .flmicl.on .lbl { color: var(--ongrade); }
#fl .flmicl.hush { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { #fl .flmicl i { transition: none; } }
.flmeter { display: block; width: min(240px, 100%); height: 8px; margin-top: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.flmeter i { display: block; height: 100%; width: 0; background: var(--ongrade); transition: width .1s; }

/* Fluid: one column for a phone or tablet; Odin's fonts, with Fluid's own blue. The reading screen (#fl) is Odin's (odin/fluency.css). */
:root {
  --bg: #F2F5F8; --surface: #FFFFFF; --sunk: #E8EEF3; --ink: #14212B; --muted: #52616E; --line: #D5DEE6;
  --accent: #1D6A96; --accent-ink: #FFFFFF; --accent-soft: #E1EEF6;
  --ongrade: #1C6E4A; --ongrade-bg: #DCEFE4; --approaching: #8F6410; --approaching-bg: #F8ECCF; --support: #B9402A; --support-bg: #F9E1DB;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151B; --surface: #172029; --sunk: #1F2A35; --ink: #E6EEF4; --muted: #9AABB9; --line: #2C3946;
  --accent: #7CC0EA; --accent-ink: #0B1720; --accent-soft: #1A3040;
  --ongrade: #6FCF9E; --ongrade-bg: #15301F; --approaching: #E2B65E; --approaching-bg: #362C15; --support: #F0907A; --support-bg: #3A1F19; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F151B; --surface: #172029; --sunk: #1F2A35; --ink: #E6EEF4; --muted: #9AABB9; --line: #2C3946;
  --accent: #7CC0EA; --accent-ink: #0B1720; --accent-soft: #1A3040;
  --ongrade: #6FCF9E; --ongrade-bg: #15301F; --approaching: #E2B65E; --approaching-bg: #362C15; --support: #F0907A; --support-bg: #3A1F19; color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 0.86rem; } .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand h1 { font-size: 1.4rem; line-height: 1.1; }
.brand .sub { font-size: 0.8rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

main { padding-block: 18px 48px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel > .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-align: center; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.sm { padding: 6px 12px; font-size: 0.88rem; border-radius: 8px; }
.btn.big { font-size: 1.12rem; padding: 14px 22px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.notice { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--accent); background: var(--accent-soft); display: grid; gap: 6px; }
.notice.bad { border-color: var(--support); background: var(--support-bg); }
.notice.ok { border-color: var(--ongrade); background: var(--ongrade-bg); }
label.field { display: grid; gap: 4px; font-size: 0.9rem; }
.panel input:not([type]), .panel input[type=password], .panel select, .panel textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); min-width: 0; }
.panel textarea { width: 100%; resize: vertical; line-height: 1.55; font-size: 1rem; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* the microphone's status: Odin's .flstatus */
.flstatus { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 0.92rem; }
.flstatus > span { flex: 1 1 280px; }
.flstatus.ok { background: var(--ongrade-bg); }
.flstatus.mid { background: var(--approaching-bg); }
.flstatus.no { background: var(--support-bg); }

/* levels and passages */
.levels { display: flex; gap: 6px; flex-wrap: wrap; }
.levels button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
.levels button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.plist { display: grid; gap: 8px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); cursor: pointer; }
.pitem:hover { border-color: var(--accent); }
.pitem[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pitem b { font-weight: 650; }
.pitem .meta { grid-column: 1 / -1; font-size: 0.84rem; color: var(--muted); }
.tag { font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--sunk); color: var(--muted); }
.pick { display: grid; gap: 12px; border: 1px solid var(--accent); border-radius: 12px; padding: 14px; }
.pick .preview { font-size: 1.08rem; line-height: 1.75; max-height: 13.5em; overflow: auto; padding: 10px 12px; border-radius: 10px; background: var(--sunk); }
.pick .preview p { margin: 0 0 .55em; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.mode { display: grid; gap: 3px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.mode b { font-size: 1.02rem; }
.mode span { font-size: 0.85rem; color: var(--muted); }
.mode.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mode.main span { color: inherit; opacity: .85; }
.mode:disabled { opacity: .5; cursor: default; }

/* readings this session */
table.runs { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.runs th, table.runs td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.runs td.n { font-family: var(--f-mono); text-align: right; }
.scroller { overflow-x: auto; }

/* the reading screen: Fluid's additions to Odin's */
#fl .fltext.marks .flw.m-x { background: var(--support-bg); color: var(--support); text-decoration: line-through; }
#fl .fltext.marks .flw.m-o { color: var(--muted); text-decoration: line-through dotted; }
#fl .fltext.marks .flw.m-s { background: var(--approaching-bg); color: var(--approaching); text-decoration: underline; }
#fl .fltext.marks { font-size: 1.15rem; line-height: 1.85; padding: 16px 18px; width: 100%; }
#fl .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); }
#fl .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--sunk); }
#fl .legend .lx::before { background: var(--support-bg); box-shadow: inset 0 0 0 1px var(--support); }
#fl .legend .ls::before { background: var(--approaching-bg); box-shadow: inset 0 0 0 1px var(--approaching); }
#fl .legend .lo::before { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
#fl .flgoal { color: var(--muted); }
details.aiset { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
details.aiset > * + * { margin-top: 8px; }
details.aiset summary { cursor: pointer; }
.warnx { color: var(--support); }
@media (max-width: 480px) { .btn.big { width: 100%; } }

</style>
</head>

<script>
const FLUID = {"version": "0.1.0-alpha", "odin": {"odinVersion": "0.10.0-alpha", "odinCommit": "198d36ef13cdb36339abbaec1eb96a706c4c742c"}};
// =====================================================================================================
// Odin 0.7: the Odin app for Android. The app shows this page and adds a bridge object, OdinAndroid, only for
// Odin's own address. Through it, Odin uses Android's ON-DEVICE speech recognizer (the student's voice never
// leaves the phone, nothing is recorded) and the phone's own voice. This file makes the bridge look like the
// browser's speech objects, so the fluency and practice code works the same in Chrome and in the app.
// In a browser there is no bridge, and this file does nothing.
// =====================================================================================================
(function () {
  const B = typeof window !== "undefined" && window.OdinAndroid;
  if (!B || typeof B.postMessage !== "function") return;
  let seq = 0;
  const waits = new Map(), recs = new Map(), says = new Map(), appFns = [];
  const send = m => { try { B.postMessage(JSON.stringify(m)); } catch (e) {} };
  const ask = (t, extra, ms) => new Promise(res => {
    const id = "q" + (++seq); waits.set(id, res); send(Object.assign({ t, id }, extra || {}));
    setTimeout(() => { if (waits.has(id)) { waits.delete(id); res(null); } }, ms || 8000);
  });
  const later = f => setTimeout(f, 0);

  // ---------- speech recognition, on the device only ----------
  class OdinRec {
    constructor() {
      Object.assign(this, { lang: "en-US", continuous: false, interimResults: false, maxAlternatives: 1, phrases: [],
        onresult: null, onerror: null, onend: null, onstart: null, onsoundlevel: null, onspeechstart: null, onspeechend: null, _id: null, _res: [], _ended: true });
    }
    // Android's on-device recognizer is the only one the app uses, so this is always true.
    get processLocally() { return true; }
    set processLocally(v) {}
    start() {
      if (!this._ended) throw new Error("This recognizer has already started.");
      this._id = "r" + (++seq); this._ended = false; this._res = []; recs.set(this._id, this);
      const bias = [].concat(this.phrases || []).map(p => (p && typeof p === "object" ? p.phrase : p)).filter(x => typeof x === "string" && x).slice(0, 150);
      send({ t: "listen", id: this._id, lang: this.lang || "en-US", continuous: !!this.continuous, interim: !!this.interimResults, bias });
    }
    stop() { if (this._id && !this._ended) send({ t: "stop", id: this._id }); }
    abort() { if (this._id && !this._ended) { send({ t: "abort", id: this._id }); this._finish(); } }
    _finish() {
      if (this._ended) return; this._ended = true; recs.delete(this._id);
      const f = this.onend; if (f) later(() => f.call(this, { type: "end" }));
    }
    _ev(m) {
      if (this._ended) return;
      if (m.ev === "start") { if (this.onstart) this.onstart({ type: "start" }); }
      else if (m.ev === "partial" || m.ev === "final") {
        if (m.ev === "partial" && !this.interimResults) return;
        const i = Math.max(0, m.i | 0); this._res[i] = { text: String(m.text || ""), final: m.ev === "final" };
        const results = [];
        for (let k = 0; k < this._res.length; k++) {
          const r = this._res[k] || { text: "", final: true };
          const alt = [{ transcript: r.text, confidence: r.final ? 0.9 : 0 }]; alt.isFinal = r.final; alt.item = n => alt[n];
          results.push(alt);
        }
        results.item = n => results[n];
        if (this.onresult) this.onresult({ type: "result", resultIndex: i, results });
      }
      // 0.8.2: how loud the microphone hears the room, a few times a second (Odin's own event: browsers have none),
      // and Android's "the student started / stopped talking".
      else if (m.ev === "level") { if (this.onsoundlevel) this.onsoundlevel({ type: "soundlevel", level: Number(m.v) || 0 }); }
      else if (m.ev === "speechstart") { if (this.onspeechstart) this.onspeechstart({ type: "speechstart" }); }
      else if (m.ev === "speechend") { if (this.onspeechend) this.onspeechend({ type: "speechend" }); }
      else if (m.ev === "error") { if (this.onerror) this.onerror({ type: "error", error: m.error || "error", message: m.message || "" }); }
      else if (m.ev === "end") this._finish();
    }
  }
  // 0.9.1: the app may first ask Android for the microphone, so wait for the person to answer (up to 2 minutes).
  // "denied": the microphone isn't allowed for the app.
  OdinRec.available = async o => { const r = await ask("status", { lang: (o && o.langs && o.langs[0]) || "en-US" }, 120000); OdinRec.why = (r && r.why) || (r ? "" : "no-answer"); return (r && r.state) || "unavailable"; };
  OdinRec.install = async o => {
    const r = await ask("install", { lang: (o && o.langs && o.langs[0]) || "en-US" }, 15 * 60000);
    OdinRec.note = (r && r.note) || ""; return !!(r && r.ok);
  };

  // ---------- the phone's own voice ----------
  class OdinUtterance {
    constructor(text) { Object.assign(this, { text: text == null ? "" : String(text), lang: "en-US", rate: 1, pitch: 1, volume: 1, voice: null, onstart: null, onend: null, onerror: null }); }
    addEventListener(type, f) { this["on" + type] = f; }
  }
  const VOICE = { name: "Android", lang: "en-US", localService: true, default: true, voiceURI: "android" };
  const synth = {
    speaking: false, pending: false, paused: false, onvoiceschanged: null,
    speak(u) {
      const id = "s" + (++seq); says.set(id, u); synth.speaking = true;
      send({ t: "say", id, text: String(u.text || ""), rate: Number(u.rate) || 1, pitch: Number(u.pitch) || 1, lang: u.lang || "en-US" });
    },
    cancel() {
      send({ t: "hush" });
      const all = [...says.values()]; says.clear(); synth.speaking = false;
      all.forEach(u => { if (u.onerror) later(() => u.onerror({ type: "error", error: "interrupted" })); });
    },
    getVoices() { return [VOICE]; }, pause() {}, resume() {}, addEventListener() {}, removeEventListener() {}
  };

  // ---------- messages from the app ----------
  const onMsg = ev => {
    let m; try { m = JSON.parse(ev && ev.data); } catch (e) { return; }
    if (!m || typeof m !== "object") return;
    if (m.t === "reply" && waits.has(m.id)) { const f = waits.get(m.id); waits.delete(m.id); f(m); }
    else if (m.t === "rec") { const r = recs.get(m.id); if (r) r._ev(m); }
    else if (m.t === "say") {
      const u = says.get(m.id); if (!u) return;
      if (m.ev === "start") { if (u.onstart) u.onstart({ type: "start" }); return; }
      says.delete(m.id); synth.speaking = says.size > 0;
      if (m.ev === "end") { if (u.onend) u.onend({ type: "end" }); }
      else if (u.onerror) u.onerror({ type: "error", error: m.error || "synthesis-failed" });
    }
    else if (m.t === "app") appFns.forEach(f => { try { f(m.ev, m); } catch (e) {} });
  };
  B.onmessage = onMsg;

  try { Object.defineProperty(window, "speechSynthesis", { value: synth, configurable: true, writable: true }); } catch (e) { try { window.speechSynthesis = synth; } catch (e2) {} }
  window.SpeechSynthesisUtterance = OdinUtterance;
  window.SpeechRecognition = OdinRec;
  if (typeof window.SpeechRecognitionPhrase !== "function") window.SpeechRecognitionPhrase = function (phrase, boost) { this.phrase = phrase; this.boost = boost == null ? 1 : boost; };
  window.ODIN_ANDROID = {
    info: ask("hello", { page: location.pathname }),
    print: title => send({ t: "print", title: title || document.title }),
    setup: () => send({ t: "setup" }),
    on: f => appFns.push(f)
  };
})();

// ---------- Odin 0.5: passages for fluency practice ----------
// Written for Odin (not taken from DIBELS or any published program). Six per level, kindergarten to grade 5.
// Lower levels lean hard on high-frequency words (the public-domain Dolch lists); every level mixes stories and
// informational text. Numbers are written as words and there are no titles like Mr. or Ms., so the speech recognizer
// and the printed page agree. A blank line starts a new paragraph.
const FL_PASSAGES = [
  // ---- kindergarten level: pre-primer and primer words, about 45 words ----
  { id: "F0-1", band: 0, title: "My Red Ball", text: "I have a red ball. I can play with my ball. Look at it go up! Look at it come down. My dog can run to the ball. He can jump and get it. Come and play with me. My dog and I like to play." },
  { id: "F0-2", band: 0, title: "The Little Cat", text: "See the little cat. It is black and white. It can run and jump. It can go into a box. Where is the cat now? Look down here! The cat is in the box. Come out, little cat. We want to play with you." },
  { id: "F0-3", band: 0, title: "At the Park", text: "We go to the park. We can see a big tree. I run to the tree. You run too. Look at the little bird. It is up in the tree. Now it can fly away. Run, run, run! We can not fly, but we can run." },
  { id: "F0-4", band: 0, title: "Help Mom", text: "Mom and I go to the store. We get milk and eggs. I help Mom. At home, we make a cake. It is a big yellow cake. It is good to eat! Mom said, “You are a good helper.” I like to help my mom." },
  { id: "F0-5", band: 0, title: "Rain, Rain", text: "Look at the rain. It is on the window. We can not go out to play. So we play in here. We make a little house. Here is a chair. Here is a big box. Come into my house! It is fun in here." },
  { id: "F0-6", band: 0, title: "My Fish", text: "I have a fish. My fish is little and yellow. It can go round and round. I look at my fish. It looks at me! I said, “Hello, fish. Do you want to eat?” Here is some food for you. My fish is funny." },

  // ---- grade 1 level: about 95 words ----
  { id: "F1-1", band: 1, title: "Sam and the Kite", text: "Sam had a new kite. It was red and blue with a long tail. “Will you help me fly it?” Sam asked his dad. “Yes, let's go to the park,” said Dad. At the park, the wind was strong. Sam held the string and ran fast. The kite went up, up, up. It flew over the trees. Then the wind stopped. The kite came down into a tree! Dad got a long stick and pulled it out. “Can we try again?” asked Sam. “Yes,” said Dad. “We will fly it every day.”" },
  { id: "F1-2", band: 1, title: "The Lost Shoe", text: "Mia could not find her shoe. She looked under the bed. It was not there. She looked in the box by the door. It was not there. “Mom, have you seen my shoe?” she asked. “Did you look in the yard?” said Mom. Mia went out to the yard. Her little dog was sitting by the tree. He had something in his mouth. It was the shoe! “You funny dog,” said Mia. She gave him a ball to play with. Then she put on her shoe and ran to the bus." },
  { id: "F1-3", band: 1, title: "Ben's Garden", text: "Ben and his grandma have a little garden. Every morning they go out to look at it. They give the plants water. They pull out the weeds. One day Ben saw something green coming up from the ground. “What is that?” he asked. “That is a bean plant,” said Grandma. “It will grow and grow.” Ben looked at the plant every day. It got taller and taller. Soon it had long green beans on it. Ben and Grandma picked the beans. They made beans and rice for dinner. “This is the best dinner,” said Ben." },
  { id: "F1-4", band: 1, title: "Fish in the Sea", text: "Many fish live in the sea. Some fish are big, and some fish are small. Some fish are blue, and some are yellow or red. Fish have fins to help them swim. They have a tail to help them go fast. Fish can not breathe air like we do. They take in water, and they get air from it. Some fish swim in a big group. When they swim together, it is hard for a big fish to catch them. The next time you go to the beach, look in the water. Can you see a little fish?" },
  { id: "F1-5", band: 1, title: "The Rainy Day Fort", text: "It was raining, so Leo and Nina could not go out to play. “What can we do?” asked Nina. “Let's make a fort,” said Leo. They put a big blanket over two chairs. They got pillows and books and a light. Then they went inside the fort. It was dark and warm in there. Leo read a book to Nina. Nina told Leo a funny story. They laughed and laughed. When the rain stopped, the sun came out. “Do you want to go out now?” asked Mom. “No,” said Leo. “We like our fort!”" },
  { id: "F1-6", band: 1, title: "Birds Make Nests", text: "In the spring, many birds make nests. A nest is a home for eggs and baby birds. Birds use sticks, grass, and mud to make a nest. Some birds make a nest in a tree. Some make a nest on the ground. Some birds even make a nest on a house! The mother bird sits on the eggs to keep them warm. After a few weeks, the eggs open. Out come the baby birds. They are hungry all the time. The mother and father bird fly back and forth to bring them food. Soon the baby birds learn to fly." },

  // ---- grade 2 level: about 135 words ----
  { id: "F2-1", band: 2, title: "The Class Pet", text: "Our class has a pet turtle named Pickles. He lives in a big glass tank by the window. Every morning, one student gets to feed him. Today it was my turn. I put three small pieces of lettuce in his dish. Pickles came out from under his rock very slowly. He looked at the food for a long time. Then he took a big bite. Everyone laughed because he looked so happy. Our teacher told us that turtles can live for many years. Some turtles live longer than people! She also said that turtles do not have teeth. They use their hard mouths to cut their food. After lunch, we drew pictures of Pickles. I drew him sitting on his rock in the sun. I think Pickles is the best class pet in the whole school." },
  { id: "F2-2", band: 2, title: "Manatees", text: "Manatees are large gray animals that live in warm water. You can find them in Florida rivers and near the ocean. Some people call them sea cows because they eat plants, just like cows eat grass. A grown manatee can be as long as a small car. Even though they are very big, manatees are gentle and slow. They swim by moving their wide, flat tails up and down. Manatees must come up to breathe air, but they can stay under the water for a long time. In the winter, the ocean gets too cold for them. Many manatees swim to warm springs where the water stays the same all year. Boats can hurt manatees, so some places have signs that tell boats to go slow. That way, these gentle animals stay safe." },
  { id: "F2-3", band: 2, title: "Grandpa's Mango Tree", text: "There is a mango tree in Grandpa's yard. It is older than my mom! Every summer, the tree is full of mangoes. At first they are small and green. Then they grow bigger and turn yellow and red. When a mango is ready, it falls down to the ground. Grandpa says that is how you know it is sweet. Last Saturday, I helped Grandpa pick up the mangoes. We filled two big baskets. Some mangoes had spots, so we put them in a pile for the birds. Grandpa cut a mango for me. The inside was bright orange and very juicy. Juice ran down my arm, and we both laughed. We took the rest of the mangoes to our neighbors. Everyone on our street loves Grandpa's tree. I hope we have a tree like that one day." },
  { id: "F2-4", band: 2, title: "How Seeds Travel", text: "Plants can not walk, but their seeds can still travel far away. Seeds move in many different ways. Some seeds are very light. The wind picks them up and carries them through the air. A dandelion seed has tiny white hairs that help it float like a little umbrella. Other seeds travel on animals. These seeds have small hooks that stick to fur. When a dog runs through a field, it may carry seeds to a new place. Some seeds travel inside fruit. A bird eats a berry, flies away, and drops the seed somewhere else. Some seeds even travel on water. A coconut can float across the ocean and grow on a new beach. When seeds travel, new plants can grow in places where there is more room and light. Next time you see a seed, think about how it got there." },
  { id: "F2-5", band: 2, title: "The Big Game", text: "Maya was the smallest player on her soccer team. She was also one of the fastest. On Saturday, her team played the Blue Sharks. The Sharks were big, and they had not lost a game all year. At first, Maya was nervous. Her legs felt like jelly. Then her coach said, “Just play the way you play in practice.” Maya took a deep breath and ran onto the field. The game was hard. The Sharks scored first. Then Maya's friend Rosa kicked the ball all the way down the field. Maya ran as fast as she could and got to the ball first. She kicked it into the corner of the net. The game was tied! Nobody scored after that, but Maya did not care. She had played her best, and that felt great. Her team cheered all the way home." },
  { id: "F2-6", band: 2, title: "Library Day", text: "Every Thursday, our class walks to the school library. It is my favorite day of the week. The library has tall shelves full of books. There are books about animals, space, sports, and much more. Our librarian always reads us a story first. Last week she read a book about a dragon who was afraid of the dark. Then we each get to pick two books to take home. I always look for books about sharks. This time, I found a book about the ocean floor. It had pictures of fish that make their own light! My friend Omar picked a book of jokes. He read them to me all the way back to class. We must bring our books back next Thursday. That way, other students can read them too. I can hardly wait for next week." },

  // ---- grade 3 level: about 170 words ----
  { id: "F3-1", band: 3, title: "The Science Fair", text: "Lily wanted to win a ribbon at the science fair, but she did not know what to study. One night, she noticed that the bread in the kitchen had green spots. “Why does bread get moldy?” she wondered. That gave her an idea. Lily put three slices of bread into three bags. She kept one bag in the refrigerator, one on the kitchen counter, and one in a warm, dark closet. Every day after school, she checked the bread and wrote down what she saw. She also drew pictures in her notebook. After one week, the bread in the closet was covered with fuzzy green and black mold. The bread on the counter had a few spots. The bread in the refrigerator looked almost new. Lily made a poster that explained what she learned: mold grows fastest where it is warm and dark. At the fair, a judge asked her many questions. Lily answered every one. She did not win first place, but she won a ribbon for the best notebook. She was very proud." },
  { id: "F3-2", band: 3, title: "Sea Turtle Nests", text: "Every summer, sea turtles crawl out of the ocean onto Florida beaches. They come at night when the sand is cool and the beach is quiet. A mother turtle uses her back flippers to dig a deep hole in the sand. Then she lays about one hundred eggs, which look like soft white ping pong balls. When she is done, she covers the eggs with sand and slowly returns to the sea. She never comes back to check on them. The warm sand keeps the eggs safe for about two months. Then the baby turtles break out of their shells. They wait until dark, and then they all dig their way up together. The tiny turtles race toward the water. They find it by following the light of the moon on the waves. Lights from houses can confuse them, so many beach towns ask people to turn off outside lights at night. Only a few babies will grow up, but the ones that do may live for more than fifty years." },
  { id: "F3-3", band: 3, title: "Fixing the Bike", text: "Carlos rode his bike to school every day, until one morning the chain came off. He had to push the bike the rest of the way, and he got to school late. All day long, he wondered how he would fix it. After school, his older cousin Ana came over to help. “First, we need to turn the bike upside down,” she said. Carlos held the bike while Ana looked at the chain. “The chain is fine,” she said. “It just slipped off the gear.” She showed Carlos how to put the chain back on the small gear in the back. Then she slowly turned the pedal so the chain would slide onto the big gear in the front. Carlos tried it himself. His hands got black with grease, but the chain went right back on. “Now you know how to fix it,” said Ana. The next morning, Carlos rode to school early. He felt proud that he could fix his own bike. He even showed his friends how to do it." },
  { id: "F3-4", band: 3, title: "How Bees Help", text: "Bees are small, but they do a very big job. As a bee flies from flower to flower, it collects a sweet liquid called nectar. While it drinks, a yellow powder called pollen sticks to the tiny hairs on its body. When the bee lands on the next flower, some of that pollen falls off. This helps the flower make seeds and fruit. Without bees, we would not have many of the foods we like to eat, such as apples, strawberries, and pumpkins. Honey bees live together in large groups called colonies. Each colony has one queen, who lays all the eggs. The worker bees do everything else. They build the hive, care for the young bees, and make honey from the nectar. Bees even talk to each other by dancing! A special dance tells the other bees where to find the best flowers. You can help bees by planting flowers and by never hurting a bee that is busy at work. So the next time a bee buzzes by, say thank you!" },
  { id: "F3-5", band: 3, title: "The Class Play", text: "Our class was putting on a play about the three little pigs, and I wanted to be the wolf. When our teacher read the parts, I was not the wolf. I was the third pig, the one who builds a house of bricks. At first I was upset, but then I read the script. The third pig had the most lines in the whole play! For two weeks, I practiced every night. My little brother pretended to be the wolf, and he huffed and puffed so hard that we both fell on the floor laughing. On the night of the play, the room was full of families. My hands were shaking when I walked on stage. Then I saw my grandmother in the front row, and she smiled at me. I took a deep breath and said my first line loud and clear. After that, the words came easily. When the play ended, everyone clapped and cheered. Being the third pig turned out to be the best part of all." },
  { id: "F3-6", band: 3, title: "Summer Storms", text: "In South Florida, summer afternoons often bring thunderstorms. In the morning, the sky may be clear and blue. As the sun heats the ground, warm, wet air rises high into the sky. When the air rises, it cools, and the water in it forms clouds. By the afternoon, the clouds can grow taller than mountains. Inside these clouds, tiny pieces of ice bump into each other. This builds up electricity, which flashes out as lightning. Lightning heats the air so quickly that the air explodes with a loud boom. That sound is thunder. Because light travels faster than sound, we see lightning before we hear thunder. You can count the seconds between the flash and the boom to tell how far away a storm is. The rain usually falls hard for a short time, and then the sun comes out again. If you hear thunder, it is time to go inside. Lightning can strike even before the rain begins. Stay safe and enjoy the cool air after the storm." },

  // ---- grade 4 level: about 200 words ----
  { id: "F4-1", band: 4, title: "The River of Grass", text: "The Everglades is a huge wetland in the southern part of Florida. Some people call it a river of grass, because it is really a very wide, very shallow river that moves slowly across the land. In some places, the water is only a few inches deep, and tall sawgrass grows as far as you can see. The Everglades is home to many animals that are hard to find anywhere else. Alligators rest in the sun on muddy banks, and wading birds such as herons and pink spoonbills hunt for fish in the water. Even the rare Florida panther lives at the edge of these wetlands. The Everglades also helps people. Water that flows through it fills the ground under South Florida, and millions of people use that water to drink. Many years ago, people built canals to drain parts of the Everglades for farms and cities. Without enough water, plants died and many animals lost their homes. Today, scientists and workers are trying to fix this damage. They are changing canals so that clean water can flow south again, the way it did long ago. Protecting the Everglades means protecting the animals and the people who need it." },
  { id: "F4-2", band: 4, title: "Drawing Together", text: "On the first day of fourth grade, a new student named Elena sat at the desk next to mine. She had just moved from another country, and she did not speak much English yet. At recess, she stood alone by the fence and watched everyone play. I wanted to talk to her, but I did not know how. That night, I asked my mom what I should do. “Maybe you can find something you both like,” she said. The next day, I brought my sketchbook to school. During recess, I sat near Elena and started drawing a horse. After a few minutes, she pointed at my picture and smiled. Then she took out her own notebook and showed me her drawings. They were amazing! She had drawn birds, flowers, and a beautiful old church from her town. We spent the whole recess drawing together, trading pencils and pointing at things. Soon she was teaching me words in Spanish, and I was teaching her words in English. By winter, Elena could talk with everyone in our class. But she still sits with me at recess, and we still draw together every day. Sometimes the best way to say hello does not need words at all." },
  { id: "F4-3", band: 4, title: "Coral Reefs", text: "Coral reefs look like colorful underwater rocks, but they are built by tiny living animals called coral polyps. Each polyp is smaller than a pencil eraser. It has a soft body and a ring of tentacles around its mouth. To protect itself, a polyp builds a hard cup of limestone around its body. When thousands of polyps live side by side, their cups join together. Over hundreds of years, the cups pile up and form a reef. Many corals get their bright colors from tiny plants that live inside them. These plants use sunlight to make food, and they share it with the coral. In return, the coral gives the plants a safe place to live. Reefs are home to about a quarter of all the kinds of fish in the ocean, even though reefs cover only a small part of the sea floor. They also protect beaches by slowing down big waves during storms. Today, many reefs are in trouble. When ocean water becomes too warm, corals push out their tiny plants and turn white. Scientists are now growing young corals in underwater nurseries and planting them back on the reef to help it recover." },
  { id: "F4-4", band: 4, title: "The Lemonade Stand", text: "Jada and her brother Marcus saved their money for a new soccer ball, but they still did not have enough. “Let's sell lemonade,” Jada said. Marcus liked the idea, so they made a plan. First, they asked their dad if they could use the table in the garage. Next, they made a list of what they needed: lemons, sugar, water, cups, and a big jug. Their dad helped them buy the lemons and sugar, and they promised to pay him back. On Saturday morning, they set up the stand at the end of their street. Marcus painted a bright yellow sign. At first, nobody stopped. Then a family walking their dog bought three cups. Soon, people were waiting in line. By lunchtime, the jug was empty, so they made more. When the day was over, they counted their money. After paying their dad back, they had just enough for the soccer ball, with a little left over. “What should we do with the extra?” Marcus asked. Jada thought for a moment. “Let's buy a new jug,” she said. “We can sell lemonade again next week.” Running a business was hard work, but it was also a lot of fun." },
  { id: "F4-5", band: 4, title: "Our Moon", text: "The moon is our closest neighbor in space, but it is very different from Earth. There is no air to breathe and no liquid water on its surface. Without air to hold in heat, the moon gets very hot in the sunlight and very cold in the dark. The ground is covered with gray dust and rocks, and it is full of round holes called craters. Most craters formed long ago when rocks from space crashed into the moon. The moon does not make its own light. Instead, it reflects light from the sun, the way a mirror does. As the moon travels around Earth, we see different amounts of its lit side. That is why the moon seems to change shape during the month. These shapes are called phases. When we can see the whole lit side, it is a full moon. When we cannot see the lit side at all, it is a new moon. The moon also pulls on Earth's oceans. This pull helps cause the tides, which make the water at the beach rise and fall each day. Astronauts first walked on the moon more than fifty years ago, and scientists are planning to send people back again." },
  { id: "F4-6", band: 4, title: "Grandma's Empanadas", text: "Every year before the holidays, my grandmother makes empanadas for the whole family. This year, she said I was old enough to help. Early on Saturday morning, we tied on our aprons and washed our hands. First, Grandma showed me how to make the dough. We mixed flour, butter, salt, and a little water until it was smooth. Then we rolled it flat and used a big cup to cut out circles. Next came the filling. Grandma had cooked beef with onions, peppers, and spices the night before, and the kitchen smelled wonderful. I put a spoonful of filling in the middle of each circle. Then I folded the dough over and pressed the edges with a fork. My first few empanadas looked lumpy, and some of the filling leaked out. Grandma laughed and said her first ones looked the same. By the end of the morning, mine looked almost as good as hers. We baked them until they were golden brown. When the family arrived that evening, Grandma told everyone that I had helped. My uncle said they were the best empanadas he had ever eaten. I smiled, because I knew that next year, I could make them again." },

  // ---- grade 5 level: about 225 words ----
  { id: "F5-1", band: 5, title: "The Water Cycle", text: "The water you drink today may once have floated in a cloud, crashed in an ocean wave, or frozen inside a glacier. Earth has about the same amount of water now as it did millions of years ago. Instead of being used up, water keeps moving from place to place in a pattern called the water cycle. The cycle is powered by the sun. When sunlight warms oceans, lakes, and rivers, some of the water turns into an invisible gas called water vapor. This process is called evaporation. Plants also release water vapor through tiny openings in their leaves. As the warm, moist air rises, it cools. Cooler air cannot hold as much water vapor, so the vapor turns back into tiny drops of liquid water. This is called condensation, and it is how clouds form. Inside a cloud, the tiny drops bump together and grow larger. When they become too heavy to float, they fall to the ground as rain, snow, sleet, or hail. This is called precipitation. Some of the water soaks into the soil and becomes groundwater. Some flows across the land into streams and rivers, which carry it back to the ocean. Then the sun warms the water again, and the cycle continues. So the next time it rains, remember that each drop has been on a very long journey." },
  { id: "F5-2", band: 5, title: "The Robot Team", text: "Nadia had never built anything more complicated than a sandcastle when she joined the robotics club at her school. The club was getting ready for a competition in just six weeks, and every team had to build a robot that could pick up small blocks and drop them into a bucket. Nadia's team had four members. Ethan was great at writing code, and Grace knew how to use every tool in the workshop. Sam loved to draw plans. At first, Nadia did not know how she could help. During the first week, the team argued about almost everything. Ethan wanted a robot with long arms, while Grace wanted one with a claw. Nobody listened to anyone else, and the robot fell apart twice. Finally, Nadia suggested that they test both ideas and keep whichever one worked better. The team agreed. She made a chart to record how many blocks each design could move in one minute. The claw won easily. After that, Nadia became the team's tester. She timed every trial, wrote down every problem, and kept everyone calm when things went wrong. On the day of the competition, their robot moved more blocks than any other robot in the first round. They did not win the final round, but the judges gave them an award for teamwork. Nadia realized that she had helped in the most important way of all." },
  { id: "F5-3", band: 5, title: "Brown Pelicans", text: "Brown pelicans are some of the easiest birds to spot along the Florida coast. They are large birds with long bills, and under each bill hangs a stretchy pouch of skin. When their wings are spread, they can be wider than a grown person is tall. Brown pelicans catch fish in a surprising way. A pelican flies over the water, searching for a school of small fish. When it spots one, it folds its wings and dives headfirst into the sea. As it hits the water, its pouch opens wide and scoops up fish along with a lot of water. Then the pelican floats on the surface and tips its bill down to drain the water out before swallowing the fish. Air sacs under its skin help cushion the crash and keep the bird floating like a cork. Pelicans live in large groups called colonies, and they build their nests on small islands where they are safe from foxes and raccoons. About fifty years ago, brown pelicans almost disappeared. A chemical used to kill insects made their eggshells so thin that the shells broke when the parents sat on them. After the chemical was banned, the pelicans slowly returned. Today, thousands of them glide over Florida beaches, a reminder that people can help animals recover. Next time you visit the beach, watch for a pelican diving for its dinner." },
  { id: "F5-4", band: 5, title: "The Empty Lot", text: "For as long as I can remember, the empty lot next to our apartment building was covered with weeds, broken bottles, and old tires. Last spring, my neighbor, a retired teacher named Rosa, knocked on our door with an idea. She wanted to turn the lot into a community garden, and she needed help. At first, I thought it was impossible. The lot was a mess, and nobody had ever taken care of it. But that Saturday, more than twenty neighbors showed up with gloves, rakes, and trash bags. We worked all day long. By sunset, the lot was clean, and we had a huge pile of trash for the city to pick up. Over the next few weeks, we built wooden boxes for planting and filled them with fresh soil. Each family got its own box. My family planted tomatoes, peppers, and beans, and my little sister insisted on sunflowers. Every evening after dinner, I went down to water our plants and pull weeds. I met neighbors I had never talked to before, like an older man who grew the biggest squash I had ever seen and a girl my age who knew everything about worms. By the end of summer, we had so many vegetables that we started sharing them with the whole building. Now the empty lot is the busiest place on our block." },

        <label class="field">Kind<select id="fln-genre"><option value="story" ${N.genre === "story" ? "selected" : ""}>Story</option><option value="information" ${N.genre === "information" ? "selected" : ""}>Informational</option></select></label>
        <label class="field" style="flex:1 1 200px">Topic<input id="fln-topic" maxlength="80" value="${esc(N.topic)}" placeholder="a class garden, volcanoes, soccer…"></label></div>
      <div class="row"><button class="btn" data-a="write" ${N.busy ? "disabled" : ""}>${N.busy ? "Writing… (a model on a school computer can take a minute)" : "Write it with AI"}</button><button class="btn ghost" data-a="type">Type or paste one</button></div>
      ${aiPanel()}
      ${N.err ? `<div class="notice bad" role="alert"><b>${esc(N.err)}</b></div>` : ""}
      ${D ? `<div style="display:grid;gap:8px">
          <label class="field">Title<input id="fln-title" maxlength="60" value="${esc(D.title)}"></label>
          <label class="field">Passage <span class="muted">(a blank line starts a new paragraph)</span><textarea id="fln-text" rows="${N.band <= 1 ? 8 : 12}">${esc(D.text)}</textarea></label>
          <p class="small"><span id="fln-count">${D.words}</span> words · ${flLevel(N.band).toLowerCase()}, where Odin's passages have about ${AI_WORDS[N.band]}${N.src ? ` · from ${esc(N.src)}` : ""}</p>
          ${D.warnings.length ? `<ul class="small">${D.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
          <div class="row"><button class="btn" data-a="psave">Save passage</button><button class="btn ghost" data-a="pcheck">Check it again</button>${N.src.startsWith("AI") ? `<button class="btn ghost" data-a="write">Write another</button>` : ""}<button class="btn ghost" data-a="pdrop">Discard</button></div>
        </div>` : ""}
      ${list.length ? `<div class="scroller"><table class="runs"><thead><tr><th>Passage</th><th>Level</th><th>Words</th><th>From</th><th></th></tr></thead><tbody>
        ${list.map(p => `<tr><td>${esc(p.title)} <span class="mono small muted">${p.id}</span></td><td>${LEVEL_SHORT(p.band)}</td><td class="n">${flPassageWords(p.id).length}</td><td class="small">${esc(p.source || "")}</td>
          <td>${S.confirmDel === p.id ? `<button class="linkbtn" data-a="pdelyes" data-id="${p.id}">Delete it</button> · <button class="linkbtn" data-a="pdelno">Keep</button>` : `<button class="linkbtn" data-a="pdel" data-id="${p.id}">Delete</button>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">No passages added yet.</p>`}
    </section>`;
  }
  async function writePassage() {
    const N = addRead(); aiReadForm(); N.err = ""; N.busy = true; render();
    try {
      const t = await aiAsk(aiPromptPassage({ band: N.band, topic: N.topic, genre: N.genre }));
      N.draft = aiParsePassage(t, { band: N.band }); N.src = "AI: " + aiSummary();
    } catch (e) { N.err = String(e.message || e); }
    N.busy = false; render();
    const el = $("#fl-added"); if (el) el.scrollIntoView({ block: "nearest" });
  }
  function savePassage() {
    const N = addRead(), D = aiCleanPassage(N.draft.title, N.draft.text, N.band);
    N.draft = D;
    if (D.words < 20) { N.err = "A passage needs at least 20 words."; return render(); }
    let n = 0; addedPassages().filter(p => p.band === N.band).forEach(p => { n = Math.max(n, Number(p.id.split("-")[1])); });
    const id = `A${N.band}-${n + 1}`;
    flAddPassages([{ id, band: N.band, title: D.title, text: D.text, topic: N.topic, source: (N.src || "typed in").slice(0, 120) }]); saveAdded();
    S.add = null; S.level = N.band; S.open = id;
    say(`Saved “${D.title}”, a ${flLevel(N.band).toLowerCase()} passage. It's in the list below.`, "ok");
    render(); window.scrollTo({ top: 0 });
  }

  // ---------- the page ----------
  function say(text, kind) { S.notice = text; S.noticeKind = kind || ""; }
  const ICON = `<svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent-soft)"/><path d="M6 11h14M6 16h20M6 21h11" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 22c2-3 4-3 6 0" stroke="var(--ongrade)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
  function micPanel() {
    const [cls, txt] = flStatusText(FLS.status);
    const btns = [];
    if (FLS.status === "manual") btns.push(`<button class="btn sm" data-a="check">Check this browser</button>`);
    if (FLS.status === "downloadable" && !FLS.installing) btns.push(`<button class="btn sm" data-a="install">Get the speech pack</button>`);
    if (["unavailable", "downloading", "denied", "downloadable", "none"].includes(FLS.status) && !FLS.installing && (FLS.status !== "none" || DROID)) btns.push(`<button class="btn ghost sm" data-a="check">Check again</button>`);
    return `<div class="flstatus ${cls}" id="mic"><span>${txt}${FL_ON_ANDROID && FLS.status !== "available" ? ` On an Android phone or tablet, use the <a href="${APK}">Fluid app for Android</a>: it listens on the device.` : ""}</span>${btns.join("")}</div>`;
  }
  function libraryPanel() {
    const lv = S.level, levels = [0, 1, 2, 3, 4, 5];
    const list = lv == null ? [] : FL_PASSAGES.filter(p => p.band === lv);
    const ready = flReady();
    return `<section class="panel" aria-labelledby="read-h">
      <div class="head"><h2 id="read-h">Read a passage</h2><span class="muted small">${FL_PASSAGES.length} passages, kindergarten to grade 5</span></div>
      ${micPanel()}
      <div class="levels" role="group" aria-label="Level">${levels.map(b => `<button data-a="level" data-v="${b}" aria-pressed="${lv === b}">${b === 0 ? "Kindergarten" : "Grade " + b}</button>`).join("")}</div>
      ${lv == null ? `<p class="small muted">Choose a level to see its passages.</p>` : `<div class="plist">${list.map(p => passageItem(p, ready)).join("")}</div>`}
    </section>`;
  }
  function passageItem(p, ready) {
    const words = flPassageWords(p.id), open = S.open === p.id, B = S.best[p.id];
    let html = `<button class="pitem" data-a="open" data-id="${p.id}" aria-expanded="${open}"><b>${esc(p.title)}</b><span class="row">${p.added ? `<span class="tag">added</span>` : ""}<span class="small muted">${words.length} words</span></span>
      <span class="meta">${esc(String(p.text).split(/\s+/).slice(0, 14).join(" "))}…${B ? ` · best today ${B.wcpm} words a minute` : ""}</span></button>`;
    if (!open) return html;
    const paras = String(p.text).split(/\n\s*\n/).map(t => `<p>${esc(t)}</p>`).join("");
    html += `<div class="pick" id="pick">
      <div class="preview" aria-label="The passage">${paras}</div>
      <p class="small muted">${flLevel(p.band)} · ${words.length} words. ${esc(goalLine(p.band))}</p>
      <div class="modes">
        <button class="mode main" data-a="read" data-kind="practice" data-id="${p.id}" ${ready ? "" : "disabled"}><b>Practice</b><span>Read the whole passage. Fluid helps with a missed word and has the reader say it again.</span></button>
        <button class="mode" data-a="read" data-kind="minute" data-id="${p.id}" ${ready ? "" : "disabled"}><b>One-minute reading</b><span>Read for one minute, as in DIBELS. Fluid says a word after a 3-second stop.</span></button>
        <button class="mode" data-a="sample" data-id="${p.id}"><b>Watch a sample reading</b><span>A pretend reader reads, and Fluid helps. No microphone needed.</span></button>
      </div>
      ${ready ? "" : `<p class="small muted">Practice and the one-minute reading need the microphone: see above.</p>`}
    </div>`;
    return html;
  }
  function runsPanel() {
    if (!S.runs.length) return "";
    return `<section class="panel" aria-labelledby="runs-h"><div class="head"><h2 id="runs-h">Readings so far</h2><button class="btn ghost sm" data-a="clearruns">Clear</button></div>
      <p class="small muted">Kept only until Fluid closes. Fluid never asks who is reading.</p>
      <div class="scroller"><table class="runs"><thead><tr><th>Time</th><th>Passage</th><th>Kind</th><th>Words correct per minute</th><th>Accuracy</th></tr></thead><tbody>
      ${S.runs.slice().reverse().map(r => `<tr><td class="small">${esc(r.at)}</td><td>${esc(r.title)} <span class="small muted">${LEVEL_SHORT(r.band)}</span></td><td class="small">${KIND[r.kind]}${r.kind === "practice" ? (r.finished ? "" : " (part)") : ""}</td><td class="n">${r.wcpm}</td><td class="n">${r.acc}%</td></tr>`).join("")}
      </tbody></table></div></section>`;
  }
  function aboutPanel() {
    return `<section class="panel" aria-labelledby="about-h"><h2 id="about-h">How Fluid works</h2>
      <ul class="small" style="margin:0;padding-left:1.2em;display:grid;gap:6px">
        <li><b>Practice:</b> the reader reads the whole passage out loud. When a word is misread or the reader stops for 2 seconds, Fluid says the word and listens for the reader to say it back, then praises and goes on. Words read turn green.</li>
        <li><b>One-minute reading:</b> like a DIBELS 8 oral reading fluency check: one minute, and Fluid says a word after a 3-second stop. The score is words correct per minute and accuracy.</li>
        <li><b>Privacy:</b> speech is recognized on the device only, so a reader's voice never leaves it, and nothing is recorded. Fluid never asks who is reading, and keeps the readings only until it closes. It keeps passages you add and which AI you chose, on this device; never a key.</li>
        <li>The passages, the scoring and the reading screen come from Odin (Project Cerberus), its fluency practice.</li>
      </ul>
      <p class="small muted">Fluid ${esc(FLUID.version)} · Odin ${esc(FLUID.odin.odinVersion)}'s fluency practice${DROID ? " · Android app" : ""}${DROID || FL_ON_ANDROID ? "" : ` · <a href="${APK}">Fluid for Android</a>`}</p>
    </section>`;
  }
  function render() {
    if (FL.on) return;
    const app = $("#app");
    app.innerHTML = `<header class="top"><div class="wrap"><div class="brand">${ICON}<div><h1>Fluid</h1><div class="sub">Fluency reading practice</div></div></div><span class="chip">Nothing about readers is kept</span></div></header>
      <main class="wrap">
        ${S.notice ? `<div class="notice ${S.noticeKind}" role="status">${esc(S.notice)}</div>` : ""}
        ${libraryPanel()}${runsPanel()}${addPanel()}${aboutPanel()}
      </main>`;
  }

  document.addEventListener("click", e => {
    if (FL.on) return;
    const t = e.target.closest("[data-a]"); if (!t) return;
    const a = t.dataset.a;
    if (a === "level") { const v = Number(t.dataset.v); S.level = S.level === v ? null : v; S.open = null; say(null); render(); }
    else if (a === "open") { S.open = S.open === t.dataset.id ? null : t.dataset.id; say(null); render(); const p = $("#pick"); if (p) p.scrollIntoView({ block: "nearest" }); }
    else if (a === "read") flOpen(t.dataset.id, t.dataset.kind, "voice");
    else if (a === "sample") flOpen(t.dataset.id, "practice", "sample");
    else if (a === "check") flCheckSpeech(false);
    else if (a === "install") flInstall();
    else if (a === "clearruns") { S.runs = []; S.best = {}; render(); }
    else if (a === "write") writePassage();
    else if (a === "type") { const N = addRead(); N.err = ""; N.src = "typed in"; N.draft = { title: "", text: "", words: 0, warnings: [] }; render(); const el = $("#fln-title"); if (el) el.focus(); }
    else if (a === "pcheck") { const N = addRead(); N.draft = aiCleanPassage(N.draft.title, N.draft.text, N.band); render(); }
    else if (a === "psave") savePassage();
    else if (a === "pdrop") { S.add = null; render(); }
    else if (a === "pdel") { S.confirmDel = t.dataset.id; render(); }
    else if (a === "pdelno") { S.confirmDel = null; render(); }
    else if (a === "pdelyes") { flDropPassage(t.dataset.id); saveAdded(); if (S.open === t.dataset.id) S.open = null; S.confirmDel = null; say("The passage is deleted.", "ok"); render(); }
    else if (a === "aisave") { aiReadForm(); aiSaveLocal(); S.aiMsg = "Fluid uses " + aiSummary() + "."; S.aiOk = true; addRead(); render(); }
    else if (a === "aitest") {
      aiReadForm(); addRead(); S.aiBusy = true; S.aiMsg = "Asking the AI…"; S.aiOk = null; render();
      aiAsk({ system: AI_SYSTEM, user: 'Reply with this JSON and nothing else: {"ok": true}', maxTokens: 60 }).then(t => { aiJSON(t); S.aiMsg = "It works: the AI answered."; S.aiOk = true; })
        .catch(e => { S.aiMsg = String(e.message || e); S.aiOk = false; }).finally(() => { S.aiBusy = false; render(); });
    }
  });
  document.addEventListener("change", e => {
    if (FL.on) return;
    const t = e.target;
    if (t.id === "ai-provider") { aiReadForm(); addRead(); const P = AI_BY_ID[t.value]; AIC.url = P.url; AIC.model = P.model; AIC.key = ""; S.aiMsg = ""; render(); }
    else if (t.id === "fln-band" || t.id === "fln-genre") addRead();
  });
  document.addEventListener("input", e => {
    if (e.target.id === "fln-text" && S.add && S.add.draft) { const n = e.target.value.split(/\s+/).filter(Boolean).length, el = $("#fln-count"); if (el) el.textContent = String(n); S.add.draft.text = e.target.value; }
    if (e.target.id === "fln-title" && S.add && S.add.draft) S.add.draft.title = e.target.value;
    if (e.target.id === "fln-topic") (S.add = S.add || newDraft()).topic = e.target.value;
  });
  document.addEventListener("toggle", e => { if (e.target.id === "ai-details") S.aiOpen = e.target.open; }, true);
  // The Android app's back button: stay while reading (and ask whether to stop).
  window.__fluidBack = () => { if (!FL.on) return ""; const b = document.querySelector('#fl [data-flx="stop"]'); if (b) flClick(b); return "stay"; };
  // The app says when Fluid leaves the screen: the microphone and the voice stop there, and the reading stops.
  if (DROID && DROID.on) DROID.on(ev => { if (ev === "hidden" && FL.on && FL.mode !== "sample" && !["done", "hello"].includes(FL.step)) flFail(flWhy("interrupted")); });

  // For the tests: what Fluid is doing, and a quick sample.
  window.__fluid = {
    state: () => ({ level: S.level, open: S.open, speech: FLS.status, reading: FL.on ? { step: FL.step, kind: FL.kind, mode: FL.mode, ptr: FL.ptr, n: FL.n, marks: FL.marks.map(m => m || "-").join("") } : null, runs: S.runs.length, android: !!DROID, version: FLUID.version }),
    result: () => FL.result,
    runs: () => S.runs.slice(),
    passages: () => FL_PASSAGES.map(p => ({ id: p.id, band: p.band, title: p.title, added: !!p.added })),
    ai: () => ({ provider: AIC.provider, url: AIC.url, model: AIC.model, hasKey: !!AIC.key }),
    speech: s => { FLS.status = s; render(); }
  };

  render();
  flCheckSpeech(true);
  if (DROID && DROID.info) DROID.info.then(i => { if (i && i.app) FLUID.app = i.app; });
})();

</script>
</body>
</html>
