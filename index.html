  // ---------- ROADMAP ----------
  const CSV_COLS = ["subject", "unit", "unit_title", "date", "lesson", "activity", "standards"];
  function roadmapCsv(subj) {
    const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
    return [CSV_COLS.join(","), ...DATA.roadmap[subj].lessons.map(l => [subj, l.unit, l.unitTitle, l.date, l.title, l.activity || "", l.standards.join(";")].map(q).join(","))].join("\n");
  }
  function parseCSV(text) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ""));
  }
  function toIso(v) {
    v = (v || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}` : null;
  }
  function importRoadmap(text, fileName) {
    const rows = parseCSV(text);
    if (rows.length < 2) return { error: "The file has no lesson rows." };
    const norm = h => h.trim().toLowerCase().replace(/[^a-z]/g, "");
    const head = rows[0].map(norm);
    const find = (...names) => head.findIndex(h => names.includes(h));
    const ix = { subject: find("subject"), unit: find("unit", "unitnumber"), unitTitle: find("unittitle", "unitname"), date: find("date", "planneddate", "week"),
      lesson: find("lesson", "title", "lessontitle"), activity: find("activity", "activities"), standards: find("standards", "standard", "benchmarks", "benchmark") };
    const missing = ["date", "lesson", "standards"].filter(k => ix[k] < 0);
    if (missing.length) return { error: `Missing column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}. The first row needs headers such as ${CSV_COLS.join(", ")}.` };
    const out = { reading: [], math: [] }, bad = [];
    rows.slice(1).forEach((r, k) => {
      const get = i => (i >= 0 ? (r[i] || "").trim() : "");
      const date = toIso(get(ix.date)), title = get(ix.lesson);
      const stds = get(ix.standards).split(/[;|\s]+/).map(x => x.trim()).filter(Boolean);
      const sv = get(ix.subject).toLowerCase();
      const subj = ix.subject < 0 || !sv ? state.subject : /math/.test(sv) ? "math" : /read|ela|lang/.test(sv) ? "reading" : null;
      if (!date || !title || !stds.length || !subj) { bad.push(k + 2); return; }
      const unit = Number(get(ix.unit)) || get(ix.unit) || 1;
      out[subj].push({ id: `X${subj[0]}${k + 1}`, unit, unitTitle: get(ix.unitTitle) || `Unit ${unit}`, date, title, activity: get(ix.activity), standards: stds });
    });
    const loaded = Object.entries(out).filter(([, ls]) => ls.length);
    if (!loaded.length) return { error: `No usable rows. Check rows ${bad.slice(0, 8).join(", ")}: each needs a date, a lesson title and at least one standard code.` };
    const known = new Set([...DATA.standards.reading, ...DATA.standards.math].map(s => s.code));
    let added = 0;
    loaded.forEach(([subj, ls]) => {
      ls.sort((a, b) => a.date.localeCompare(b.date));
      DATA.roadmap[subj] = { name: fileName, lessons: ls };
      ls.forEach(l => l.standards.forEach(c => { if (!known.has(c)) { known.add(c); added++; } }));
    });
    return { loaded: loaded.map(([s, ls]) => `${ls.length} ${s} lessons`).join(" and "), bad, added, subj: loaded[0][0] };
  }
  function classStatuses(subj) { const o = {}; DATA.students.forEach(s => { standards(DATA, subj, s.code).forEach(z => { (o[z.code] = o[z.code] || { label: z.label, st: {} }).st[s.code] = z.status; }); }); return o; }
  function setLesson(id, value) {
    const subj = state.subject;
    const before = classStatuses(subj);
    if (DATA.overrides[id] === value) delete DATA.overrides[id]; else DATA.overrides[id] = value;
    saveOv();
    const after = classStatuses(subj);
    const lines = [];
    Object.entries(after).forEach(([code, a]) => {
      const b = before[code];
      if (!b) return;
      const changed = Object.keys(a.st).filter(k => a.st[k] !== b.st[k]);
      if (!changed.length) return;
      const cnt = k => Object.values(a.st).filter(v => v === k).length;
      const nowTaught = a.st[Object.keys(a.st)[0]] !== "nottaught";
      lines.push(nowTaught ? `<b>${code}</b> ${esc(a.label)} now counts as taught: ${cnt("mastered")} mastered, ${cnt("remediate")} need remediation${cnt("nocheck") ? `, ${cnt("nocheck")} not checked yet` : ""}.`
        : `<b>${code}</b> ${esc(a.label)} is now not taught: results for all ${DATA.students.length} students are set aside.`);
    });
    const ls = DATA.roadmap[subj].lessons.find(l => l.id === id);
    state.rmNotice = { title: `${ls.title}: ${DATA.overrides[id] ? (DATA.overrides[id] === "taught" ? "marked taught" : "marked not taught") : "back to the roadmap date"}.`, lines: lines.length ? lines : ["Another lesson already covers the same standard, so no student results changed."] };
    render();
  }
  function viewRoadmap() {
    const rm = DATA.roadmap[state.subject];
    const ls = [...rm.lessons].sort((a, b) => a.date.localeCompare(b.date));
    const stat = l => lessonStatus(DATA, l);
    const past = ls.filter(l => l.date <= DATA.today);
    const taughtN = ls.filter(l => stat(l) === "taught").length, notN = ls.filter(l => stat(l) === "nottaught").length, upN = ls.filter(l => stat(l) === "upcoming").length;
    const units = [...new Set(ls.map(l => l.unit))];
    const cat = catalog(DATA, state.subject), info = taughtInfo(DATA, state.subject);
    const stTaught = cat.filter(c => info[c.code] && info[c.code].taught).length;
    const n = state.rmNotice;
    let todayShown = false;
    const lessonRow = l => {
      const st = stat(l), ov = DATA.overrides[l.id], future = l.date > DATA.today;
      let pre = "";
      if (!todayShown && future) { todayShown = true; pre = `<div class="today">TODAY · ${TODAY.toUpperCase()}</div>`; }
      const note = ov === "nottaught" ? (DATA.overrideNotes[l.id] || "Marked not taught by the teacher") : ov === "taught" && future ? "Marked taught early by the teacher" : "";
      return pre + `<div class="lesson ${st === "nottaught" ? "skipped" : ""}">
        <span class="d">${fmtDate(l.date).replace(/, \d{4}/, "")}</span>
        <div style="min-width:0"><div class="t">${esc(l.title)}</div>${l.activity ? `<div class="a">${esc(l.activity)}</div>` : ""}
          <div class="codes">${l.standards.map(c => `<span>${esc(c)}</span>`).join("")}</div>${note ? `<div class="note">${esc(note)}</div>` : ""}</div>
        <div class="ctl"><div class="seg small" role="group" aria-label="Was ${esc(l.title)} taught?">
          <button class="on-taught" data-lesson="${l.id}" data-set="taught" aria-pressed="${st === "taught"}">Taught</button>
          <button class="on-not" data-lesson="${l.id}" data-set="nottaught" aria-pressed="${st === "nottaught"}">Not taught</button></div>
          <span class="small muted">${st === "upcoming" ? "Upcoming" : ov ? "Teacher mark" : "By roadmap date"}</span></div>
      </div>`;
    };
    return `<section class="view" aria-labelledby="tab-roadmap">
      <div class="head"><h2>${SUBJ[state.subject]} curriculum roadmap</h2><span class="muted small">${esc(rm.name)}</span></div>
      <p class="lead">The roadmap says what is planned. Your marks say what actually happened. A standard counts as taught only when a lesson covering it is marked taught, so a skipped lesson never counts against a student.</p>
      <div class="rm-tools">
        <span class="btn upl">Upload roadmap (CSV)<input type="file" id="rm-file" accept=".csv,text/csv,text/plain" aria-label="Upload roadmap CSV"></span>
        <button class="btn ghost" id="rm-restore">Restore sample roadmap</button>
        <button class="btn ghost" id="rm-copy">Copy this roadmap as CSV</button>
      </div>
      ${n ? `<div class="notice" role="status"><b>${esc(n.title)}</b>${n.lines && n.lines.length ? `<ul>${n.lines.map(z => `<li>${z}</li>`).join("")}</ul>` : ""}${n.foot ? `<span class="small muted">${n.foot}</span>` : ""}</div>` : ""}
      <div class="stats">
        <div class="stat"><span class="n">${taughtN}</span><span class="l">lessons taught</span></div>
        <div class="stat ${notN ? "flag" : ""}"><span class="n">${notN}</span><span class="l">lessons marked not taught</span></div>
        <div class="stat"><span class="n">${upN}</span><span class="l">lessons still ahead</span></div>
        <div class="stat"><span class="n">${stTaught} of ${cat.length}</span><span class="l">standards taught so far</span></div>
      </div>
      ${units.map(u => { const ul = ls.filter(l => l.unit === u); return `<div class="panel rm-unit"><h3>Unit ${esc(u)} · ${esc(ul[0].unitTitle)}</h3>${ul.map(lessonRow).join("")}</div>`; }).join("")}
      ${!todayShown ? `<div class="today">TODAY · ${TODAY.toUpperCase()}</div>` : ""}
      <details class="ai"><summary>CSV format for your own roadmap</summary>
        <p class="small muted" style="margin-top:8px">One row per lesson. Columns: ${CSV_COLS.join(", ")}. Dates as YYYY-MM-DD or M/D/YYYY. Separate several standards with a semicolon. The file is read inside this page; nothing is uploaded to a server.</p>
        <pre>${esc(roadmapCsv(state.subject).split("\n").slice(0, 6).join("\n"))}\n…</pre></details>
    </section>`;
  }

  // ---------- ESE / IEP ----------
  function goalParts(g, code, subj) {
    const name = who(code, true), tpl = g.tpl, r = g.rung, p = g.p;
    const ff = DATA.files.find(f => f.active && f.subject === subj && f.source === "FAST");
    const ir = DATA.files.find(f => f.active && f.subject === subj && f.source === "i-Ready");
    const tests = [ir ? `i-Ready Diagnostic 1: ${ir.rows[code].overall}` : "", ff ? `FAST PM1: ${ff.rows[code].ss}, Level ${ff.rows[code].level}` : ""].filter(Boolean).join("; ");
    const b = g.baseline;
    const base = !b ? `No item-level baseline yet: give a 10-item probe on this skill before the IEP meeting.`
      : b.source === "probe" ? `On a teacher probe on ${fmtLong(b.date)}, ${name} had ${b.right} of ${b.total} ${tpl.task} (${b.pct}% accuracy).`
      : `On Performance Matters items for ${b.codes.join(" and ")}, ${name} answered ${b.right} of ${b.total} correctly (${b.pct}% accuracy).`;
    const present = `${name}'s overall ${subj} level is ${gl(p.overall.gl)}, ${glWords(p.overall.gl).toLowerCase()}${tests ? ` (${tests})` : ""}. The lowest weak skill on the ladder is ${r.name.toLowerCase()}, at grade level ${gl(r.gl)}. ${base} This affects ${name}'s progress in grade 3 ${subj} instruction in the general education classroom.`;
    const goal = `By ${fmtLong(g.end)}, given ${tpl.condition}, ${name} will ${tpl.behavior} with ${g.target}% accuracy in ${tpl.trials}, as measured by ${tpl.measure}.`;
    const bms = g.benchmarks.map(x => `By ${fmtLong(x.date)}, ${name} will ${tpl.behavior} with ${x.pct}% accuracy in ${tpl.trials}.`);
    return { present, goal, bms };
  }
  function viewEse() {
    const list = DATA.students.filter(s => s.ese);
    const cat = { reading: catalog(DATA, "reading"), math: catalog(DATA, "math") };
    return `<section class="view" aria-labelledby="tab-ese">
      <div class="head"><h2>ESE students and IEP goal drafts</h2><span class="muted small">${list.length} students with an IEP</span></div>
      <p class="lead">Each goal is a draft for the IEP team, written from current data in the academic goal format: when and under what condition, what the student will do, with what accuracy, and how it is measured. Odin redrafts them with the newest data before each meeting.</p>
      <p class="privacy">IEP details stay on the Project Cerberus server like everything else. The local AI receives the goal area, levels and baseline only, never the exceptionality or the student's name.</p>
      ${list.map(s => {
        const e = s.ese;
        return `<div class="panel ese-card">
          <div class="head"><h3>${who(s.code)} <span class="muted small" style="font-weight:400">${esc(e.exceptionality)}</span></h3><span class="pill draft">Draft for the IEP team · annual review ${fmtDate(e.review)}</span></div>
          <div class="ese-meta">
            <div><span class="k src">Services</span><ul>${e.services.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
            <div><span class="k src">Classroom accommodations</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${e.accommodations.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>
          </div>
          ${["reading", "math"].map(subj => {
            if (!e.areas.includes(subj)) return `<div class="goal"><p class="small muted"><b>${SUBJ[subj]}</b> is not an IEP goal area for this student. The classroom action plan covers it.</p></div>`;
            const g = iepGoal(DATA, subj, s.code);
            if (g.none) return `<div class="goal"><span class="k src">${SUBJ[subj]} goal</span><p class="small">Every ${subj} skill is at grade level (overall ${gl(g.overall.gl)}). Discuss with the team whether this goal area is still needed.</p></div>`;
            const parts = goalParts(g, s.code, subj);
            const shares = DATA.students.filter(x => { const pp = profile(DATA, subj, x.code); return pp.p1 && pp.p1.id === g.rung.id; }).length;
            const rec = shareReason(shares, DATA.students.length);
            const align = g.align.map(c => { const z = cat[subj].find(q => q.code === c); return `<span class="mono">${c}</span> ${z ? esc(z.label) : ""}`; }).join(" · ");
            return `<div class="goal">
              <div class="head"><span class="k src">${SUBJ[subj]} goal · priority 1: ${esc(g.rung.name)} (level ${gl(g.rung.gl)})</span>
                <button class="btn ghost" data-copygoal="${s.code}|${subj}" style="padding:4px 12px;font-size:0.84rem">Copy goal</button></div>
              <p class="pl"><b>Present level.</b> ${esc(parts.present)}</p>
              <p class="goaltext"><b>Annual goal.</b> ${esc(parts.goal)}</p>
              ${parts.bms.length ? `<div><p class="small" style="margin-bottom:4px"><b>Short-term benchmarks</b></p><ul>${parts.bms.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : `<p class="small" style="color:var(--approaching);font-weight:600">Benchmarks will be set once a baseline probe is recorded.</p>`}
              <p class="small"><b>Aligned to:</b> ${align}</p>
              <p class="small"><b>Progress monitoring:</b> ${esc(g.tpl.trials)}, ${esc(g.tpl.measure)}, graphed weekly and reported to the family each grading period.</p>
              <div style="display:grid;gap:6px"><p class="small"><b>Intervention options</b></p>${formatBlock(g.rung.id, rec.f === "whole" ? "small" : rec.f, rec.why + " Deliver it as the IEP services describe.")}</div>
            </div>`;
          }).join("")}
        </div>`;
      }).join("")}
    </section>`;
  }

  // ---------- GROUPS ----------
  function viewGroups() {
    const all = profiles();
    const L = ladder();
    const baseMax = state.subject === "reading" ? 3 : 1;
    const groups = L.map(r => ({ r, members: all.filter(x => x.p.p1 && x.p.p1.id === r.id), also: all.filter(x => x.p.p2 && x.p.p2.id === r.id) })).filter(g => g.members.length);
    const none = all.filter(x => !x.p.p1);
    const chip = x => `<button class="chip" data-open="${x.s.code}">${who(x.s.code)} <span class="mono muted small">${x.p.p1 ? gl(x.p.p1.gl) : gl(x.p.overall.gl)}</span></button>`;
    return `<section class="view" aria-labelledby="tab-groups">
      <div class="head"><h2>${SUBJ[state.subject]} small groups by Priority 1</h2></div>
      <p class="lead">Students who share a Priority 1 can be taught together. The number beside each student is their grade level in that skill. Groups rebuild themselves each time a new file is imported.</p>
      <div class="groups">
        ${groups.map(g => `<div class="panel group ${g.r.level <= baseMax ? "base" : ""}">
          <span class="lv">rung ${g.r.level}${g.r.level <= baseMax ? " · foundation" : ""}</span>
          <h3>${esc(g.r.name)} · ${g.members.length} student${g.members.length > 1 ? "s" : ""}</h3>
          <div class="members">${g.members.map(chip).join("")}</div>
          <p class="small"><b>${g.members.length >= DATA.students.length / 2 ? "Whole class" : g.members.length >= 2 ? "Small group" : "One-on-one"}:</b> ${esc(LIBRARY[g.r.id].iv[recommendFormat(g.members.length, DATA.students.length)])}</p>
          ${g.also.length ? `<p class="small muted">Could join later (Priority 2): ${g.also.map(x => who(x.s.code, true)).join(", ")}</p>` : ""}
        </div>`).join("")}
        ${none.length ? `<div class="panel group"><span class="lv">no priority needed</span><h3>Enrichment · ${none.length} student${none.length > 1 ? "s" : ""}</h3>
          <div class="members">${none.map(chip).join("")}</div><p class="small muted">Every measured skill is at grade level; the number shown is the overall level.</p></div>` : ""}
      </div>
    </section>`;
  }

  // ---------- IMPORTS ----------
  function viewImports() {
    const n = state.notice;
    return `<section class="view" aria-labelledby="tab-imports">
      <div class="head"><h2>Imports</h2></div>
      <p class="lead">Each export lands in one local database, so results entered on different days merge on their own. Switch a file off to see the results without it; nothing is deleted.</p>
      ${n ? `<div class="notice" role="status"><b>${esc(n.title)}</b>${n.lines.length ? `<ul>${n.lines.map(z => `<li>${z}</li>`).join("")}</ul>` : ""}${n.foot ? `<span class="small muted">${n.foot}</span>` : ""}</div>` : ""}
      <div class="files">
        ${DATA.files.map(f => `<div class="file ${f.pending ? "pending" : ""}">
          <div style="display:grid;gap:4px;min-width:0">
            <span class="fn">${esc(f.name)}</span>
            <span class="meta"><span class="src">${esc(f.source)}</span><span>${SUBJ[f.subject]}</span><span>${esc(f.what)}</span><span>${f.pending ? "New file, not imported yet" : "Imported " + fmtDate(f.date)}</span></span>
          </div>
          ${f.pending ? `<button class="btn" data-import="${f.id}">Import</button>`
            : `<button class="switch" role="switch" aria-checked="${f.active}" data-toggle="${f.id}" aria-label="Include ${esc(f.name)}"><span class="k"></span>${f.active ? "Included" : "Off"}</button>`}
          ${f.imported ? `<div style="grid-column:1/-1"><button class="btn ghost" data-import="${f.id}">Import this file again</button></div>` : ""}
        </div>`).join("")}
      </div>
      <p class="foot-note">Odin reads these exports from i-Ready, the Florida Reporting System and Performance Matters, replaces names with codes, converts every result to a grade level, and asks you to confirm a preview before saving.</p>
    </section>`;
  }
  function snapshot(subj) { const o = {}; DATA.students.forEach(s => { o[s.code] = { p: profile(DATA, subj, s.code), st: standards(DATA, subj, s.code) }; }); return o; }
  function diff(before, after) {
    const out = [];
    let stdChecked = 0;
    DATA.students.forEach(s => {
      const a = before[s.code].p, b = after[s.code].p;
      const nm = `<b>${esc(who(s.code, true))}</b>`;
      if ((a.p1?.id || null) !== (b.p1?.id || null)) out.push(`${nm}: Priority 1 moved from ${a.p1 ? esc(a.p1.name) : "none"} to ${b.p1 ? esc(b.p1.name) + " (" + gl(b.p1.gl) + ")" : "none"}.`);
      else if ((a.p2?.id || null) !== (b.p2?.id || null)) out.push(`${nm}: Priority 2 changed from ${a.p2 ? esc(a.p2.name) : "none"} to ${b.p2 ? esc(b.p2.name) : "none"}.`);
      b.rungs.forEach((r, i) => { const o = a.rungs[i];
        if (o.band !== r.band) out.push(`${nm}: ${esc(r.name)} went from ${glWords(o.gl).toLowerCase()} (${gl(o.gl)}) to ${glWords(r.gl).toLowerCase()} (${gl(r.gl)}).`); });
      after[s.code].st.forEach((z, i) => { if (before[s.code].st[i].status !== z.status) stdChecked++; });
    });
    return { out, stdChecked };
  }
  function doImport(id) {
    const f = DATA.files.find(z => z.id === id);
    if (f.imported) {
      state.notice = { title: `${f.name} is already in the database. Nothing was added.`, lines: [], foot: "The tool matches student, test and date, so a repeated file never counts twice." };
      return render();
    }
    const before = snapshot(f.subject);
    f.active = true; f.pending = false; f.imported = true;
    const d = diff(before, snapshot(f.subject));
    state.notice = { title: `Imported ${f.name}: ${f.items ? f.items.length + " items" : ""} for ${Object.keys(f.rows).length} students. ${d.out.length} skill change${d.out.length === 1 ? "" : "s"} and ${d.stdChecked} new standards results:`, lines: d.out,
      foot: `Fractions now has item-level evidence, measurement reaches the ${MIN_ITEMS}-item minimum, and the fraction and geometry standards move from "taught, not checked yet" to mastered or needs remediation. See the Standards tab.` };
    if (state.subject !== f.subject) { state.subject = f.subject; saveUi(); }
    render();
  }
  function doToggle(id) {
    const f = DATA.files.find(z => z.id === id);
    const before = snapshot(f.subject);
    f.active = !f.active;
    const d = diff(before, snapshot(f.subject));
    state.notice = { title: `${f.active ? "Included" : "Switched off"} ${f.name}. ${d.out.length} skill change${d.out.length === 1 ? "" : "s"} and ${d.stdChecked} standards results changed in ${SUBJ[f.subject].toLowerCase()}:`, lines: d.out, foot: d.out.length ? "" : "No priorities or skill levels changed band." };
    render();
  }

  // ---------- HOW ----------
  function viewHow() {
    const cut = s => FAST_CUTS[s].map((c, i) => `<tr><td>Level ${i + 1}: ${c[0]} to ${c[1]}</td><td class="n">${c[2].toFixed(1)} to ${c[3].toFixed(1)}</td></tr>`).join("");
    return `<section class="view" aria-labelledby="tab-how">
      <div class="panel" style="display:grid;gap:14px">
        <h2>What Odin does on Project Cerberus, step by step</h2>
        <ol class="steps">
          <li><span><b>Import exports</b> from i-Ready, FAST (Florida Reporting System) and Performance Matters: CSV, Excel or PDF.</span></li>
          <li class="lock"><span><b>Replace names with codes</b> like S-004. The name key stays in a separate encrypted file.</span></li>
          <li class="lock"><span><b>Save to a local database</b> that grows with every test and never syncs to the cloud.</span></li>
          <li class="lock"><span><b>Load the curriculum roadmap</b> and let the teacher mark each lesson taught or not taught.</span></li>
          <li class="lock"><span><b>Score with plain code:</b> convert every result to a grade level, count standards as taught only from the teacher's marks, and walk the skill ladder.</span></li>
          <li class="lock"><span><b>Draft plans with a local AI model</b> that sees codes and grade levels only, with no internet connection.</span></li>
          <li class="lock"><span><b>Teacher reviews and approves</b> every plan before it reaches a student or family.</span></li>
          <li><span><b>Print or export</b>, and only then do names come back, from the name key.</span></li>
        </ol>
        <p class="foot-note">Green steps happen entirely on the Project Cerberus server, with Odin's internet access blocked.</p>
      </div>
      <div class="panel" style="display:grid;gap:10px">
        <h3>One scale for every report</h3>
        ${scaleKey()}
        <p class="small" style="max-width:72ch"><b>Grade level</b> says where a student is working, from kindergarten to grade 12, compared with their own grade: at grade level, just below (less than half a grade), below (half a grade to a grade) or way below (more than a grade).</p>
        <p class="small" style="max-width:72ch"><b>Support tiers</b> are separate: they say how much help a student needs. <span class="tag tier t1">Tier 1</span> at or just below grade level, core instruction. <span class="tag tier t2">Tier 2</span> needs interventions in some areas (one or more skills below grade level). <span class="tag tier t3">Tier 3</span> needs many supports and/or is working way below grade level (more than a grade below overall, or 3 or more skills below grade level). Odin suggests a tier from the data; the school's MTSS team decides.</p>
        <p class="small muted" style="max-width:72ch">Teachers and families see the same kind of number everywhere: overall, per skill, in the class grid and in the family note. A skill level is the average of its sources after conversion. Overall is the average of the two whole-test results, i-Ready overall placement and the FAST scale score.</p>
      </div>
      <div class="cols">
        <div class="panel" style="display:grid;gap:10px">
          <h3>i-Ready and FAST categories</h3>
          <table class="ref"><thead><tr><th>Result</th><th>Grade level</th></tr></thead><tbody>
            ${Object.entries(IREADY_GL).map(([k, v]) => `<tr><td>i-Ready: ${esc(k)}</td><td class="n">${gl(v)}</td></tr>`).join("")}
            ${Object.entries(FAST_CAT_GL).map(([k, v]) => `<tr><td>FAST category: ${esc(k)} the standard</td><td class="n">${gl(v)}</td></tr>`).join("")}
            <tr><td>Performance Matters: percent right on a skill's items, ${MIN_ITEMS} or more items</td><td class="n">0% = 1.5, 50% = 2.8, 100% = 4.0</td></tr>
          </tbody></table>
        </div>
        <div class="panel" style="display:grid;gap:10px">
          <h3>FAST grade 3 scale scores</h3>
          <table class="ref"><thead><tr><th>Reading achievement level</th><th>Grade level</th></tr></thead><tbody>${cut("reading")}</tbody></table>
          <table class="ref"><thead><tr><th>Math achievement level</th><th>Grade level</th></tr></thead><tbody>${cut("math")}</tbody></table>
          <p class="small muted">Level 3 is on grade level, so it maps to 3.0 to 3.4. PM1 and PM2 test the whole year's content, so lower levels early in the year are expected.</p>
        </div>
      </div>
      <div class="cols">
        <div class="panel" style="display:grid;gap:10px">
          <h3>How priorities are set</h3>
          <ol class="rules">
            <li>Each subject has a ladder of skills, foundation first. Reading runs from sounds to decoding to sight words, then vocabulary, then comprehension.</li>
            <li>Priority 1 is the lowest skill below grade level (under ${BANDS.support.toFixed(1)}). Priority 2 is the next one up.</li>
            <li>Two skills on the same rung are ordered by the lower level.</li>
            <li>If fewer than two skills are below grade level, skills just below grade level (${BANDS.support.toFixed(1)} to 2.9) fill in.</li>
            <li>Weak skills above Priority 2 are marked "waits" and rechecked later.</li>
          </ol>
        </div>
        <div class="panel" style="display:grid;gap:10px">
          <h3>How standards mastery is set</h3>
          <table class="ref"><tbody>
            <tr><td><span class="st nottaught">Not taught yet</span></td><td>No roadmap lesson covering it is marked taught, including lessons the teacher marked not taught. Never counts against a student; its test items are set aside.</td></tr>
            <tr><td><span class="st nocheck">Taught, not checked yet</span></td><td>Taught, but fewer than ${MASTERY.minItems} items on that benchmark so far.</td></tr>
            <tr><td><span class="st mastered">Mastered</span></td><td>${Math.round(MASTERY.pct * 100)}% or more right on ${MASTERY.minItems}+ items.</td></tr>
            <tr><td><span class="st remediate">Needs remediation</span></td><td>Taught and checked, below ${Math.round(MASTERY.pct * 100)}%.</td></tr>
          </tbody></table>
          <p class="small muted">Phonics and word analysis (ELA.3.F.1.3) uses the i-Ready Phonics placement: grade 3 level or above counts as mastered.</p>
        </div>
      </div>
      <div class="cols">
        <div class="panel" style="display:grid;gap:10px">
          <h3>IEP goal format</h3>
          <p class="small"><b>By</b> [date one year after the annual review], <b>given</b> [condition], [student] <b>will</b> [observable behavior] <b>with</b> [__% accuracy] <b>in</b> [__ of __ trials], <b>as measured by</b> [tool].</p>
          <p class="small muted">The baseline comes from the newest teacher probe or Performance Matters items on that skill. Two short-term benchmarks step from the baseline to the target at four and eight months.</p>
        </div>
        <div class="panel" style="display:grid;gap:10px">
          <h3>One-on-one, small group or whole class</h3>
          <ol class="rules"><li>Half the class or more shares the need: whole class.</li><li>Two or more students share it: small group.</li><li>Only one student: one-on-one.</li></ol>
          <p class="small muted">All three options are shown every time, so the teacher can choose.</p>
        </div>
      </div>
      <div class="panel" style="display:grid;gap:10px">
        <h3>This online demo compared with Odin on Project Cerberus</h3>
        <div class="scroller" style="border:0"><table class="ref"><thead><tr><th></th><th>This demo</th><th>Odin on Project Cerberus</th></tr></thead><tbody>
          <tr><td><b>Students</b></td><td>18 invented Grade 3 students</td><td>Your class, from real exports</td></tr>
          <tr><td><b>Where it runs</b></td><td>This web page</td><td>The Project Cerberus server at school, internet blocked for Odin</td></tr>
          <tr><td><b>Conversions and cut points</b></td><td>Placeholder values shown above</td><td>Set by your school or district</td></tr>
          <tr><td><b>Curriculum roadmap</b></td><td>Invented sample, or a CSV you upload; teacher marks stay in this browser</td><td>Your roadmap or curriculum map, saved with the teacher's marks on the Project Cerberus server</td></tr>
          <tr><td><b>IEP information</b></td><td>4 invented students, drafted goals</td><td>Entered by the ESE teacher; goals reviewed and decided by the IEP team</td></tr>
          <tr><td><b>Plan drafts</b></td><td>Fixed template</td><td>Local AI model (for example Qwen3.8-27B on an RTX 3090)</td></tr>
          <tr><td><b>Approval</b></td><td>Resets when the page reloads</td><td>Saved with the teacher's edits and the date</td></tr>
        </tbody></table></div>
        <p class="small muted">Score ranges, reporting categories and benchmarks follow the Florida Department of Education's 2026–27 FAST fact sheet and test blueprints. Sources: <a href="https://www.fldoe.org/file/20102/2627FASTGrd310FS.pdf" target="_blank" rel="noopener">FAST 3–10 fact sheet</a>, <a href="https://www.fldoe.org/core/fileparse.php/20102/urlt/TDS-FAST-Math.pdf" target="_blank" rel="noopener">FAST math blueprint</a>, <a href="https://fldoe.org/core/fileparse.php/7539/urlt/UsingBESTToolsBuildFAST-Results-HO.pdf" target="_blank" rel="noopener">FAST ELA blueprint</a>.</p>
      </div>
    </section>`;
  }

  // ---------- RENDER ----------
  function render() {
    document.querySelectorAll("[data-subj]").forEach(b => b.setAttribute("aria-pressed", b.dataset.subj === state.subject));
    document.querySelectorAll("[data-names]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.names === "1") === state.names));
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
    const v = { class: viewClass, student: viewStudent, standards: viewStandards, roadmap: viewRoadmap, ese: viewEse, groups: viewGroups, imports: viewImports, how: viewHow }[state.tab];
    $("#main").innerHTML = v();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, tr[data-open]");
    if (!t) return;
    if (t.dataset.subj) { state.subject = t.dataset.subj; state.rung = null; saveUi(); render(); }
    else if (t.dataset.names) { state.names = t.dataset.names === "1"; saveUi(); render(); }
    else if (t.dataset.tab) { if (t.dataset.tab !== "imports") state.notice = null; if (t.dataset.tab !== "roadmap") state.rmNotice = null; setTab(t.dataset.tab); }
    else if (t.dataset.lesson) setLesson(t.dataset.lesson, t.dataset.set);
    else if (t.id === "rm-restore") { DATA.roadmap = JSON.parse(JSON.stringify(SAMPLE_RM)); DATA.overrides = JSON.parse(JSON.stringify(SAMPLE_OV)); saveOv(); state.rmNotice = { title: "Sample roadmaps and the teacher's sample marks are back.", lines: [] }; render(); }
    else if (t.id === "rm-copy") {
      const txt = roadmapCsv(state.subject);
      const done = ok => { t.textContent = ok ? "Copied" : "Copy failed: use the format below"; setTimeout(() => { t.textContent = "Copy this roadmap as CSV"; }, 1800); };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    }
    else if (t.dataset.copygoal) {
      const [code, subj] = t.dataset.copygoal.split("|");
      const g = iepGoal(DATA, subj, code), parts = goalParts(g, code, subj);
      const txt = [`Present level: ${parts.present}`, "", `Annual goal: ${parts.goal}`, ...(parts.bms.length ? ["", "Short-term benchmarks:", ...parts.bms.map(x => "- " + x)] : [])].join("\n");
      const done = ok => { t.textContent = ok ? "Copied" : "Select the text to copy"; setTimeout(() => { t.textContent = "Copy goal"; }, 1800); };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    }
    else if (t.dataset.open) openStudent(t.dataset.open);
    else if (t.dataset.rung) { state.rung = t.dataset.rung; render(); }
    else if (t.dataset.lang) { state.lang = t.dataset.lang; render(); }
    else if (t.dataset.import) doImport(t.dataset.import);
    else if (t.dataset.toggle) doToggle(t.dataset.toggle);
    else if (t.id === "prev" || t.id === "next") {
      const i = DATA.students.findIndex(z => z.code === state.code);
      const n = DATA.students.length;
      state.code = DATA.students[(i + (t.id === "next" ? 1 : n - 1)) % n].code; state.rung = null; render();
    }
    else if (t.id === "approve") { state.approvals[state.code + ":" + state.subject] = TODAY; render(); }
    else if (t.id === "unapprove") { delete state.approvals[state.code + ":" + state.subject]; render(); }
    else if (t.id === "copy") {
      const p = profile(DATA, state.subject, state.code);
      const txt = planText(p, state.code, planFor(p), standards(DATA, state.subject, state.code));
      const done = ok => { t.textContent = ok ? "Copied" : "Select the text to copy"; setTimeout(() => { t.textContent = "Copy plan text"; }, 1800); };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    }
  });
  document.addEventListener("keydown", e => {
    const tr = e.target.closest && e.target.closest("tr[data-open]");
    if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openStudent(tr.dataset.open); }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "pick") { state.code = e.target.value; state.rung = null; render(); }
    if (e.target.id === "rm-file" && e.target.files && e.target.files[0]) {
      const file = e.target.files[0];
      const fail = msg => { state.rmNotice = { title: `Could not read ${file.name}.`, lines: [esc(msg)] }; render(); };
      file.text().then(txt => {
        const res = importRoadmap(txt, file.name);
        if (res.error) return fail(res.error);
        state.subject = res.subj; saveUi();
        state.rmNotice = { title: `Loaded ${res.loaded} from ${file.name}.`, lines: [
          ...(res.bad.length ? [`Skipped row${res.bad.length > 1 ? "s" : ""} ${res.bad.slice(0, 10).join(", ")}: missing a date, title or standard.`] : []),
          ...(res.added ? [`${res.added} standard code${res.added > 1 ? "s" : ""} not in the demo list were added.`] : []),
          "Lessons dated on or before today count as taught until you mark them otherwise. In this demo the file lasts until the page reloads."] };
        render();
      }, () => fail("The browser could not open the file."));
    }
  });
  render();
})();
</script>

</body></html>
