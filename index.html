<body>
<style>
/* Layout: one working column; a tab bar under a slim header; the student view splits ladder | evidence on wide screens. */
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --sunk: #E9EDF1; --ink: #17212B; --muted: #5A6673; --line: #D8DEE4;
  --accent: #2E4BB5; --accent-ink: #FFFFFF; --accent-soft: #E3E8F8;
  --support: #B9402A; --support-bg: #F9E1DB; --approaching: #8F6410; --approaching-bg: #F8ECCF; --tier2: #6B5100; --tier2-bg: #FBE89A;
  --ongrade: #1C6E66; --ongrade-bg: #D9EEEA; --above: #0F5A52; --above-bg: #B5DDD6; --none: #6B7682; --none-bg: #E6EAEE;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141A; --surface: #161E26; --sunk: #1D2730; --ink: #E4E9EE; --muted: #9AA6B2; --line: #2A3540;
  --accent: #8EA4F2; --accent-ink: #0E141A; --accent-soft: #1F2A4A;
  --support: #F0907A; --support-bg: #3A1F19; --approaching: #E2B65E; --approaching-bg: #362C15; --tier2: #F3D35C; --tier2-bg: #3D3410;
  --ongrade: #63C7B9; --ongrade-bg: #13312D; --above: #9BE3D8; --above-bg: #1C4A43; --none: #8E99A5; --none-bg: #232D37; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #161E26; --sunk: #1D2730; --ink: #E4E9EE; --muted: #9AA6B2; --line: #2A3540;
  --accent: #8EA4F2; --accent-ink: #0E141A; --accent-soft: #1F2A4A;
  --support: #F0907A; --support-bg: #3A1F19; --approaching: #E2B65E; --approaching-bg: #362C15; --tier2: #F3D35C; --tier2-bg: #3D3410;
  --ongrade: #63C7B9; --ongrade-bg: #13312D; --above: #9BE3D8; --above-bg: #1C4A43; --none: #8E99A5; --none-bg: #232D37; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1140px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 0.85rem; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { display: grid; gap: 3px; width: 22px; }
.mark i { display: block; height: 4px; border-radius: 2px; background: var(--accent); }
.mark i:nth-child(1) { width: 100%; opacity: .45 } .mark i:nth-child(2) { width: 75%; opacity: .7 } .mark i:nth-child(3) { width: 50% }
.brand h1 { font-size: 1.3rem; }
.brand .sub { font-size: 0.82rem; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; cursor: pointer; font-size: 0.88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.banner { background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.banner .wrap { padding-block: 9px; font-size: 0.88rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.banner b { font-weight: 700; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; font-size: 0.93rem; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 22px 48px; }
section.view { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.lead { max-width: 68ch; color: var(--muted); }

/* grade-level scale key */
.scalekey { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 0.86rem; }
.scalekey b { font-family: var(--f-mono); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.stat .n { font-family: var(--f-display); font-size: 1.7rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.86rem; color: var(--muted); }
.stat.flag { border-color: var(--support); }
.stat.flag .n { color: var(--support); }

/* bands */
.b-support { background: var(--support-bg); color: var(--support); }
.b-approaching { background: var(--approaching-bg); color: var(--approaching); }
.b-ongrade { background: var(--ongrade-bg); color: var(--ongrade); }
.b-above { background: var(--above-bg); color: var(--above); }
.b-none { background: var(--none-bg); color: var(--none); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.82rem; color: var(--muted); align-items: center; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.sw.b-support, .fill.b-support, .seg-m.support { background: var(--support); }
.sw.b-approaching, .fill.b-approaching { background: var(--approaching); }
.sw.b-ongrade, .fill.b-ongrade, .seg-m.mastered { background: var(--ongrade); }
.sw.b-above, .fill.b-above { background: var(--above); }
.sw.b-none, .seg-m.nocheck { background: var(--none); }
.tag { display: inline-flex; align-items: center; font-family: var(--f-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: .02em; border-radius: 5px; padding: 1px 6px; line-height: 1.5; white-space: nowrap; }
.tag.p1 { background: var(--ink); color: var(--bg); }
.tag.p2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.tag.wait { background: var(--sunk); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 0.84rem; background: var(--surface); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
.src { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }

/* status chips for standards */
.st { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.st.mastered { background: var(--ongrade-bg); color: var(--ongrade); }
.st.remediate { background: var(--support-bg); color: var(--support); }
.st.nocheck { background: var(--none-bg); color: var(--none); }
.st.nottaught { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

/* where P1 falls */
.dist { display: grid; gap: 7px; }
.dist .row { display: grid; grid-template-columns: minmax(0, 15rem) 1fr 2.2rem; gap: 10px; align-items: center; font-size: 0.9rem; }
.dist .bar { height: 14px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.dist .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.dist .row.base .bar i { background: var(--support); }
.dist .cnt { font-family: var(--f-mono); text-align: right; font-weight: 600; }
.dist .lvl { color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem; margin-right: 6px; }

/* heat map */
.scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.heat { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.88rem; }
table.heat th, table.heat td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
table.heat thead th { font-size: 0.75rem; font-weight: 600; color: var(--muted); vertical-align: bottom; background: var(--surface); }
table.heat thead th .lv { display: block; font-family: var(--f-mono); font-size: 0.7rem; opacity: .8; }
table.heat th.who, table.heat td.who { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.heat th.tier, table.heat td.tier { border-right: 1px solid var(--line); font-weight: 600; color: var(--ink); }
table.heat tbody tr { cursor: pointer; }
table.heat tbody tr:hover td.who, table.heat tbody tr:focus-visible td.who { color: var(--accent); }
table.heat td.cell { padding: 4px; }
table.heat td.cell .c { position: relative; display: block; min-width: 50px; border-radius: 6px; padding: 5px 4px; font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
table.heat td.ovr .c { font-size: 0.98rem; }
table.heat td.cell .c.p1 { box-shadow: inset 0 0 0 2px var(--ink); }
table.heat td.cell .c.p2 { box-shadow: inset 0 0 0 1.5px var(--ink); }
table.heat td.cell .c .t { position: absolute; top: -7px; right: -3px; font-size: 0.62rem; padding: 0 4px; border-radius: 4px; background: var(--ink); color: var(--bg); line-height: 1.4; }
table.heat td.cell .c.p2 .t { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
table.heat td.meta { font-size: 0.82rem; color: var(--muted); }
table.heat tr:last-child td { border-bottom: 0; }
.code { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); margin-right: 6px; }

/* student */
.picker { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
.overall { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 20px; align-items: center; }
.overall .big { font-family: var(--f-display); font-size: 2.6rem; font-weight: 650; line-height: 1; border-radius: 10px; padding: 12px 16px; font-variant-numeric: tabular-nums; text-align: center; min-width: 6.5rem; }
.overall .big small { display: block; font-family: var(--f-body); font-size: 0.78rem; font-weight: 600; margin-top: 6px; }
.overall .parts { display: grid; gap: 4px; font-size: 0.88rem; }
.overall .parts div { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
@media (max-width: 520px) { .overall { grid-template-columns: 1fr; } .overall .big { justify-self: start; } }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.ladder { display: grid; gap: 6px; }
.rung { display: grid; grid-template-columns: 2rem minmax(0, 1fr) 5.4rem; gap: 10px; align-items: center; padding: 8px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%; }
.rung:hover { background: var(--sunk); }
.rung[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rung .lvl { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); text-align: center; }
.rung .body { display: block; min-width: 0; }
.rung .nm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; font-size: 0.92rem; margin-bottom: 5px; }
.track { display: block; position: relative; height: 12px; background: var(--sunk); border-radius: 4px; }
.track i.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.track b.cut { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--muted); opacity: .55; }
.track b.cut.g3 { border-left: 2px solid var(--ink); opacity: .7; }
.rung .sc { font-family: var(--f-mono); font-weight: 600; text-align: right; font-size: 1rem; }
.rung .sc small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 0.72rem; color: var(--muted); line-height: 1.25; }
.axis { display: grid; grid-template-columns: 2rem minmax(0, 1fr) 5.4rem; gap: 10px; padding-inline: 8px; font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.axis .sc-axis { position: relative; height: 16px; }
.axis .sc-axis span { position: absolute; transform: translateX(-50%); }
.axis .sc-axis span.g3 { color: var(--ink); font-weight: 600; }
.foot-note { font-size: 0.82rem; color: var(--muted); }

.ev { display: grid; gap: 12px; }
.evline { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
.evline.off { opacity: .72; border-style: dashed; }
.evline .r { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.evline .pts { font-family: var(--f-mono); font-weight: 600; }
.items { display: grid; gap: 3px; font-size: 0.84rem; }
.items div { display: grid; grid-template-columns: 2.4rem 7.6rem minmax(0, 1fr) 1.4rem; gap: 6px; align-items: baseline; }
.items .ok { color: var(--ongrade); font-weight: 700; } .items .no { color: var(--support); font-weight: 700; }
.total { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-weight: 600; flex-wrap: wrap; }

/* standards */
.stdlist { display: grid; gap: 4px; }
.stdrow { display: grid; grid-template-columns: 8.4rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.stdrow:last-child { border-bottom: 0; }
.stdrow .basis { grid-column: 2 / 3; font-size: 0.8rem; color: var(--muted); }
.stdgroup { display: grid; gap: 4px; }
.stdgroup + .stdgroup { margin-top: 10px; }
.stdgroup h4 { margin: 0; font-size: 0.78rem; font-family: var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.class-std details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0; }
.class-std details + details { margin-top: 8px; }
.class-std summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 8.4rem minmax(0, 1fr) minmax(120px, 15rem) 5.6rem; gap: 6px 14px; align-items: center; padding: 11px 14px; }
.class-std summary::-webkit-details-marker { display: none; }
.class-std summary .when { font-size: 0.8rem; color: var(--muted); text-align: right; }
.class-std .inside { padding: 0 14px 14px; display: grid; gap: 10px; }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.stack .seg-m { display: block; height: 100%; }
.stack-note { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
@media (max-width: 720px) {
  .class-std summary { grid-template-columns: minmax(0, 1fr) auto; }
  .class-std summary .lbl { grid-column: 1 / -1; }
  .class-std summary .stackwrap { grid-column: 1 / -1; }
  .stdrow { grid-template-columns: minmax(0, 1fr) auto; }
  .stdrow .lbl, .stdrow .basis { grid-column: 1 / -1; }
}

/* plan */
.plan { display: grid; gap: 16px; }
.plan .status { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px; font-size: 0.84rem; font-weight: 600; }
.pill.draft { background: var(--approaching-bg); color: var(--approaching); }
.pill.ok { background: var(--ongrade-bg); color: var(--ongrade); }
.block { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.block ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 3px; }
.block .k { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.family { background: var(--sunk); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.family p { max-width: 68ch; }
.btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.check { font-size: 0.86rem; color: var(--ongrade); font-weight: 600; }
details.ai { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
details.ai summary { cursor: pointer; font-weight: 600; }
pre { margin: 10px 0 0; padding: 12px; background: var(--sunk); border-radius: 8px; overflow-x: auto; font-family: var(--f-mono); font-size: 0.78rem; line-height: 1.45; }

/* groups */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.group { display: grid; gap: 10px; align-content: start; }
.group .members { display: flex; flex-wrap: wrap; gap: 6px; }
.group .lv { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.group.base { border-color: var(--support); }

/* imports */
.files { display: grid; gap: 10px; }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.file.pending { border-style: dashed; border-color: var(--accent); }
.file .fn { font-family: var(--f-mono); font-size: 0.86rem; word-break: break-all; }
.file .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.84rem; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.86rem; border: 0; background: none; padding: 4px 0; }
.switch .k { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch .k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-checked="true"] .k { background: var(--ongrade); }
.switch[aria-checked="true"] .k::after { left: 19px; }
.notice { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; border: 1px solid var(--accent); background: var(--accent-soft); }
.notice ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }

/* how it works */
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; }
ol.steps li::before { content: counter(s); font-family: var(--f-mono); font-weight: 600; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 0.85rem; }
ol.steps li.lock::before { background: var(--ongrade-bg); color: var(--ongrade); }
table.ref { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.ref th, table.ref td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ref th { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
table.ref td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }

/* intervention formats */
.formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.fmt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; font-size: 0.88rem; }
.fmt .src { display: flex; justify-content: space-between; gap: 6px; }
.fmt.rec { border-color: var(--accent); background: var(--accent-soft); }
.fmt.rec .src { color: var(--accent); }
.tag.iep { background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
.tag.tier { font-size: 0.8rem; padding: 2px 8px; }
.tag.tier.t1 { background: var(--ongrade-bg); color: var(--ongrade); }
.tag.tier.t2 { background: var(--tier2-bg); color: var(--tier2); }
.tag.tier.t3 { background: var(--support-bg); color: var(--support); }

/* roadmap */
.rm-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rm-unit { display: grid; gap: 0; }
.rm-unit h3 { margin-bottom: 6px; }
.lesson { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.lesson:last-child { border-bottom: 0; }
.lesson .d { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); }
.lesson .t { font-weight: 600; }
.lesson .a { font-size: 0.84rem; color: var(--muted); }
.lesson .codes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.lesson .codes span { font-family: var(--f-mono); font-size: 0.72rem; background: var(--sunk); border-radius: 4px; padding: 1px 6px; }
.lesson.skipped .t { text-decoration: line-through; text-decoration-color: var(--support); }
.lesson .note { font-size: 0.8rem; color: var(--support); }
.lesson .ctl { display: grid; gap: 4px; justify-items: end; }
.seg.small button { padding: 3px 10px; font-size: 0.8rem; }
.seg.small button.on-taught[aria-pressed="true"] { background: var(--ongrade-bg); color: var(--ongrade); }
.seg.small button.on-not[aria-pressed="true"] { background: var(--support-bg); color: var(--support); }
.today { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--accent); font-weight: 600; padding: 6px 0; }
.today::before, .today::after { content: ""; flex: 1; border-top: 2px solid var(--accent); }
.upl { position: relative; overflow: hidden; }
.upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ESE */
.ese-card { display: grid; gap: 14px; }
.ese-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px 20px; font-size: 0.88rem; }
.ese-meta ul { margin: 4px 0 0; padding-left: 1.1rem; }
.goal { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.goaltext { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 1rem; line-height: 1.55; max-width: 80ch; }
.goal .pl { font-size: 0.9rem; max-width: 80ch; }
.goal ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 3px; font-size: 0.9rem; }
.privacy { font-size: 0.86rem; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); }

@media (max-width: 560px) {
  .lesson { grid-template-columns: minmax(0, 1fr); }
  .lesson .ctl { justify-items: start; }
  .controls { margin-left: 0; }
  .dist .row { grid-template-columns: minmax(0, 9rem) 1fr 2rem; }
  .items div { grid-template-columns: 2rem minmax(0, 1fr) 1.2rem; }
  .items div .bm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

// ---- conversions to grade level (demo values; the school sets the real table) ----
const IREADY_GL = {
  "Surpassed Level": 4.0, "Mid or Above Grade Level": 3.6, "Early On Grade Level": 3.1,
  "1 Grade Level Below": 2.5, "2 Grade Levels Below": 1.5, "3 or More Grade Levels Below": 0.5
};
const FAST_CAT_GL = { "Above": 3.8, "At/Near": 3.2, "Below": 2.2 };
// FAST grade 3 achievement levels (2026-27 fact sheet) and the grade-level span each maps to
const FAST_CUTS = {
  reading: [[140, 185, 1.0, 1.9], [186, 200, 2.0, 2.9], [201, 212, 3.0, 3.4], [213, 224, 3.5, 3.9], [225, 260, 4.0, 4.9]],
  math:    [[140, 182, 1.0, 1.9], [183, 197, 2.0, 2.9], [198, 208, 3.0, 3.4], [209, 224, 3.5, 3.9], [225, 260, 4.0, 4.9]]
};
const PM_GL = pct => 1.5 + 2.5 * pct;       // 0% = 1.5, 50% = 2.75, 75% = 3.4, 100% = 4.0
const MIN_ITEMS = 3;                         // per skill, before Performance Matters counts
const MASTERY = { pct: 0.75, minItems: 2 };  // per standard
const BANDS = { support: 2.5, ongrade: 3.0, above: 4.0 };

const r1 = x => Math.round(x * 10) / 10;
function fastGL(subject, ss) {
  for (const [lo, hi, a, b] of FAST_CUTS[subject]) if (ss <= hi) return r1(a + (b - a) * Math.max(0, ss - lo) / (hi - lo));
  return 4.9;
}
function fmtGL(g) {
  if (g == null) return "–";
  const v = r1(g);
  return v < 1 ? "K." + Math.round(v * 10) : v.toFixed(1);
}
function band(g) {
  if (g == null) return "none";
  if (g < BANDS.support) return "support";
  if (g < BANDS.ongrade) return "approaching";
  if (g < BANDS.above) return "ongrade";
  return "above";
}

// ---- curriculum roadmap: a standard counts as taught only when a lesson covering it is marked taught ----
function lessonStatus(data, lesson) {
  return (data.overrides && data.overrides[lesson.id]) || (lesson.date <= data.today ? "taught" : "upcoming");
}
function taughtInfo(data, subject) {
  const info = {};
  const lessons = ((data.roadmap || {})[subject] || { lessons: [] }).lessons;
  for (const ls of lessons) {
    const st = lessonStatus(data, ls);
    for (const c of ls.standards) {
      const x = info[c] || (info[c] = { taught: false, lessons: [], skipped: [], next: null, firstTaught: null });
      x.lessons.push(ls);
      if (st === "taught") { x.taught = true; if (!x.firstTaught || ls.date < x.firstTaught) x.firstTaught = ls.date; }
      else if (st === "nottaught") x.skipped.push(ls);
      else if (!x.next || ls.date < x.next) x.next = ls.date;
    }
  }
  return info;
}
// Standards catalog plus any codes an uploaded roadmap brings in
function catalog(data, subject) {
  const list = data.standards[subject].map(s => ({ ...s }));
  const known = new Set(list.map(s => s.code));
  for (const ls of ((data.roadmap || {})[subject] || { lessons: [] }).lessons)
    for (const c of ls.standards) if (!known.has(c)) { known.add(c); list.push({ code: c, label: ls.title, rung: null }); }
  return list;
}

// Build the evidence for one student, one skill, from the files that are switched on.
function evidence(data, subject, code, rungId, taught) {
  taught = taught || taughtInfo(data, subject);
  const lines = [];
  const files = data.files.filter(f => f.active && f.subject === subject);
  for (const f of files) {
    const row = f.rows[code];
    if (!row) continue;
    if (f.source === "i-Ready") {
      const doms = IREADY_DOMAINS[subject][rungId] || [];
      if (!doms.length) continue;
      const parts = doms.map(([k, label]) => ({ label, value: row[k], gl: IREADY_GL[row[k]] }));
      lines.push({ source: "i-Ready", file: f.name, detail: parts, gl: r1(parts.reduce((a, p) => a + p.gl, 0) / parts.length), counted: true });
    } else if (f.source === "FAST") {
      const cat = FAST_CATS[subject][rungId];
      if (!cat) continue;
      lines.push({ source: "FAST", file: f.name, detail: [{ label: cat, value: row[rungId] }], gl: FAST_CAT_GL[row[rungId]], counted: true });
    }
  }
  const items = [], untaught = [];
  for (const f of files.filter(f => f.source === "Performance Matters")) {
    f.items.forEach((it, k) => {
      if (it.rung !== rungId || !f.rows[code]) return;
      const row = { ...it, file: f.name, correct: f.rows[code][k] };
      (taught[it.code] && taught[it.code].taught ? items : untaught).push(row);
    });
  }
  if (items.length || untaught.length) {
    const right = items.reduce((a, it) => a + it.correct, 0);
    const pct = items.length ? right / items.length : 0;
    lines.push({ source: "Performance Matters", items, untaught, right, total: items.length, pct: Math.round(pct * 100), gl: items.length ? r1(PM_GL(pct)) : null, counted: items.length >= MIN_ITEMS });
  }
  const counted = lines.filter(l => l.counted);
  const gl = counted.length ? r1(counted.reduce((a, l) => a + l.gl, 0) / counted.length) : null;
  return { lines, gl, band: band(gl) };
}

// Overall level for a subject: average of the two whole-test results (i-Ready overall placement, FAST scale score).
function overall(data, subject, code) {
  const parts = [];
  for (const f of data.files.filter(f => f.active && f.subject === subject)) {
    const row = f.rows[code];
    if (!row) continue;
    if (f.source === "i-Ready") parts.push({ source: "i-Ready overall", raw: row.overall, gl: IREADY_GL[row.overall] });
    if (f.source === "FAST") parts.push({ source: "FAST PM1", raw: `${row.ss}, Level ${row.level}`, gl: fastGL(subject, row.ss) });
  }
  const gl = parts.length ? r1(parts.reduce((a, p) => a + p.gl, 0) / parts.length) : null;
  return { gl, band: band(gl), parts };
}

// Walk the ladder from the bottom. P1 = lowest skill that needs support; P2 = the next one up.
// If fewer than two need support, approaching skills fill in, lowest first.
function profile(data, subject, code) {
  const taught = taughtInfo(data, subject);
  const rungs = LADDERS[subject].map((r, idx) => ({ ...r, idx, ...evidence(data, subject, code, r.id, taught) }));
  const order = [...rungs].sort((a, b) => a.level - b.level || (a.gl ?? 99) - (b.gl ?? 99));
  const picks = [...order.filter(r => r.band === "support"), ...order.filter(r => r.band === "approaching")].slice(0, 2);
  rungs.forEach(r => { r.tag = null; });
  if (picks[0]) picks[0].tag = "P1";
  if (picks[1]) picks[1].tag = "P2";
  rungs.forEach(r => { if (!r.tag && r.band === "support") r.tag = "Waits"; });
  return { rungs, p1: picks[0] || null, p2: picks[1] || null, overall: overall(data, subject, code) };
}

// Standards mastery: Mastered, Needs remediation, Not taught yet, or Taught but not checked yet.
// "Taught" comes from the roadmap and the teacher's marks, never from a test date.
function standards(data, subject, code, taught) {
  taught = taught || taughtInfo(data, subject);
  const files = data.files.filter(f => f.active && f.subject === subject);
  return catalog(data, subject).map(st => {
    const t = taught[st.code] || { taught: false, lessons: [], skipped: [], next: null };
    const items = [];
    for (const f of files.filter(f => f.source === "Performance Matters")) {
      f.items.forEach((it, k) => { if (it.code === st.code && f.rows[code]) items.push({ ...it, file: f.name, correct: f.rows[code][k] }); });
    }
    let status, basis;
    const ir = st.code === "ELA.3.F.1.3" ? files.find(f => f.source === "i-Ready") : null;
    if (!t.taught) {
      status = "nottaught";
      basis = t.skipped.length ? `On the roadmap ${t.skipped[0].date}, marked not taught` + (t.next ? `; rescheduled ${t.next}` : "")
        : t.next ? `Planned ${t.next}` : "Not on the roadmap";
      if (items.length) basis += ` · ${items.length} test item${items.length > 1 ? "s" : ""} not counted`;
    } else if (ir && ir.rows[code]) {
      const v = ir.rows[code].PH;
      status = IREADY_GL[v] >= 3.0 ? "mastered" : "remediate";
      basis = "i-Ready Phonics: " + v;
    } else if (items.length >= MASTERY.minItems) {
      const right = items.reduce((a, it) => a + it.correct, 0);
      status = right / items.length >= MASTERY.pct ? "mastered" : "remediate";
      basis = `${right} of ${items.length} items right`;
    } else {
      status = "nocheck";
      basis = items.length ? `Only ${items.length} item so far` : "No test item yet";
    }
    return { ...st, taught: t.taught, firstTaught: t.firstTaught || null, next: t.next, skipped: t.skipped, lessons: t.lessons, items, status, basis };
  });
}

const round5 = x => Math.round(x / 5) * 5;
function addMonths(iso, m) {
  const [y, mo, d] = iso.split("-").map(Number);
  const t = new Date(Date.UTC(y, mo - 1 + m, d));
  return t.toISOString().slice(0, 10);
}
function iepGoal(data, subject, code) {
  const s = data.students.find(x => x.code === code);
  if (!s || !s.ese) return null;
  const p = profile(data, subject, code);
  if (!p.p1) return { none: true, overall: p.overall };
  const r = p.p1, tpl = IEP_TEMPLATES[r.id];
  let baseline = null;
  const probe = s.ese.probes && s.ese.probes[r.id];
  if (probe) baseline = { pct: Math.round((probe.right / probe.total) * 100), source: "probe", date: probe.date, right: probe.right, total: probe.total };
  else {
    const pm = r.lines.find(l => l.source === "Performance Matters" && l.total);
    if (pm) baseline = { pct: pm.pct, source: "pm", right: pm.right, total: pm.total, codes: [...new Set(pm.items.map(i => i.code))] };
  }
  let target = tpl.target;
  if (baseline && baseline.pct >= target - 5) target = Math.min(100, round5(baseline.pct + 15));
  const start = s.ese.review, end = addMonths(s.ese.review, 12);
  const benchmarks = baseline ? [1, 2].map(k => ({ date: addMonths(start, 4 * k), pct: round5(baseline.pct + ((target - baseline.pct) * k) / 3) })) : [];
  return { rung: r, p, tpl, target, baseline, start, end, benchmarks, align: ALIGN[r.id] || [] };
}

      : f === "small" ? `${n} students share this need, so a small group fits.` : `No classmate shares this need right now, so one-on-one fits.` };
  }
  const fmtDate = d => { const [y, m, dd] = d.split("-").map(Number); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1] + " " + dd + ", " + y; };
  const scaleKey = () => `<div class="scalekey"><span class="muted">Grade-level scale:</span><span><b>3.0</b> working at grade 3 standards</span><span><b>3.1 to 3.9</b> progress through grade 3</span><span><b>4.0</b> ready for grade 4</span><span><b>2.x</b> grade 2 level</span></div>`;
  const legend = () => `<div class="legend"><span><span class="sw b-support"></span>Below or way below grade level (under ${BANDS.support.toFixed(1)})</span><span><span class="sw b-approaching"></span>Just below grade level (${BANDS.support.toFixed(1)} to 2.9)</span><span><span class="sw b-ongrade"></span>At grade level (3.0 to 3.9)</span><span><span class="sw b-above"></span>Above grade level (4.0+)</span></div>`;

  function setTab(t) { state.tab = t; render(); try { history.replaceState(null, "", "#" + t); } catch (e) {} window.scrollTo({ top: 0 }); }
  function openStudent(code) { state.code = code; state.rung = null; setTab("student"); }

  // ---------- CLASS ----------
  function viewClass() {
    const all = profiles();
    const L = ladder();
    const ff = fastFile(), ir = ireadyFile();
    const onGrade = all.filter(x => x.p.overall.gl != null && x.p.overall.gl >= 3.0).length;
    const avg = all.reduce((a, x) => a + (x.p.overall.gl || 0), 0) / all.length;
    const lvl1 = (state.subject === "reading" && ff) ? DATA.students.filter(s => ff.rows[s.code].level === 1) : [];
    const baseMax = state.subject === "reading" ? 3 : 1;
    const baseCount = all.filter(x => x.p.p1 && x.p.p1.level <= baseMax && x.p.p1.band === "support").length;
    const files = activeFiles(state.subject);
    const counts = L.map(r => ({ r, n: all.filter(x => x.p.p1 && x.p.p1.id === r.id).length }));
    const noneN = all.filter(x => !x.p.p1).length;
    const maxN = Math.max(1, ...counts.map(c => c.n), noneN);
    const sorted = [...all].sort((a, b) => {
      const ai = a.p.p1 ? a.p.p1.idx : 99, bi = b.p.p1 ? b.p.p1.idx : 99;
      return ai - bi || (a.p.p1?.gl ?? 99) - (b.p.p1?.gl ?? 99) || a.s.code.localeCompare(b.s.code);
    });
    return `<section class="view" aria-labelledby="tab-class">
      <div class="head"><h2>${SUBJ[state.subject]}: where the class needs help first</h2>
        <span class="muted small">${files.length} files combined · ${[...new Set(files.map(f => f.source))].join(", ")}</span></div>
      ${scaleKey()}
      <div class="stats">
        <div class="stat"><span class="n">${gl(avg)}</span><span class="l">class average overall ${SUBJ[state.subject].toLowerCase()} level</span></div>
        <div class="stat"><span class="n">${onGrade} of ${DATA.students.length}</span><span class="l">students at or above grade level overall (3.0+)</span></div>
        <div class="stat"><span class="n" style="display:flex;gap:8px">${[1, 2, 3].map(n => `<span class="tag tier t${n}" style="font:inherit;padding:0 12px;border-radius:8px" title="Tier ${n}">${all.filter(x => tierN(x.p) === n).length}</span>`).join("")}</span><span class="l">students in support Tier 1 · Tier 2 · Tier 3, suggested from the data for the MTSS team</span></div>
        <div class="stat ${baseCount ? "flag" : ""}"><span class="n">${baseCount}</span><span class="l">students whose Priority 1 is at the base of the ladder (${state.subject === "reading" ? "rungs 1 to 3: sounds, decoding, sight words" : "rung 1: number sense"})</span></div>
        ${state.subject === "reading" ? `<div class="stat ${lvl1.length ? "flag" : ""}"><span class="n">${lvl1.length}</span><span class="l">at Level 1 on FAST ELA PM1. Promotion to grade 4 needs Level 2 or higher on PM3, with good-cause exemptions.</span></div>`
          : `<div class="stat"><span class="n">${noneN}</span><span class="l">students with every skill at grade level, ready for enrichment</span></div>`}
      </div>
      <div class="panel" style="display:grid;gap:14px">
        <div class="head"><h3>Where Priority 1 falls, foundation first</h3><span class="muted small">Number of students</span></div>
        <div class="dist">
          ${counts.map(c => `<div class="row ${c.r.level <= baseMax ? "base" : ""}"><span><span class="lvl">${c.r.level}</span>${esc(c.r.name)}</span><span class="bar"><i style="width:${(c.n / maxN) * 100}%"></i></span><span class="cnt">${c.n}</span></div>`).join("")}
          <div class="row"><span class="muted"><span class="lvl">–</span>No priority needed</span><span class="bar"><i style="width:${(noneN / maxN) * 100}%;opacity:.35"></i></span><span class="cnt">${noneN}</span></div>
        </div>
      </div>
      <div style="display:grid;gap:10px">
        <div class="head"><h3>Every student, every skill, in grade levels</h3>${legend()}</div>
        <div class="scroller"><table class="heat">
          <thead><tr><th class="who">Student</th><th class="ovr">Overall</th><th class="tier" title="Support tier">Tier</th>${L.map(r => `<th><span class="lv">rung ${r.level}</span>${esc(r.short)}</th>`).join("")}<th>FAST PM1</th><th>i-Ready</th></tr></thead>
          <tbody>${sorted.map(({ s, p }) => `<tr tabindex="0" data-open="${s.code}" aria-label="Open ${esc(who(s.code, true))}">
            <td class="who">${who(s.code)}</td>
            <td class="cell ovr"><span class="c b-${p.overall.band}">${gl(p.overall.gl)}</span></td><td class="meta tier">${tierN(p) ? `<span class="tag tier t${tierN(p)}">Tier ${tierN(p)}</span>` : "–"}</td>
            ${p.rungs.map(r => `<td class="cell"><span class="c b-${r.band} ${r.tag === "P1" ? "p1" : r.tag === "P2" ? "p2" : ""}" title="${esc(r.name)}: ${gl(r.gl)}">${gl(r.gl)}${r.tag === "P1" || r.tag === "P2" ? `<span class="t">${r.tag}</span>` : ""}</span></td>`).join("")}
            <td class="meta mono">${ff ? `${ff.rows[s.code].ss} · L${ff.rows[s.code].level}` : "–"}</td>
            <td class="meta">${ir ? shortPlace(ir.rows[s.code].overall) : "–"}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="foot-note">Every number is a grade level. The last two columns show the original FAST and i-Ready results each level was converted from. Sorted by where each student's Priority 1 sits on the ladder; tap a row to open that student.</p>
      </div>
    </section>`;
  }

  // ---------- STUDENT ----------
  function planFor(p) {
    const pool = b => p.rungs.filter(r => r.band === b && !r.tag).sort((a, z) => z.gl - a.gl);
    const top = [...pool("above"), ...pool("ongrade")].slice(0, 2);
    return { p1: p.p1, p2: p.p2, strengths: top.length ? top : pool("approaching").slice(0, 2), L: LIBRARY };
  }
  function evidenceSummary(r) {
    return r.lines.filter(l => l.counted).map(l => {
      if (l.source === "Performance Matters") return `Performance Matters ${l.right} of ${l.total} items (${gl(l.gl)})`;
      if (l.source === "FAST") return `FAST ${l.detail[0].value} (${gl(l.gl)})`;
      return `i-Ready ${l.detail.map(d => shortPlace(d.value)).join(" / ")} (${gl(l.gl)})`;
    }).join(" · ");
  }
  function familyNote(plan, p, code, lang) {
    const name = who(code, true);
    const join = (arr, word) => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " " + word + " " + arr[arr.length - 1];
    const ov = gl(p.overall.gl);
    if (lang === "es") {
      const subj = state.subject === "reading" ? "lectura" : "matemáticas";
      const lvl = `El nivel general de ${subj} de ${name} es ${ov}. En esta escala, 3.0 significa que trabaja con los estándares de tercer grado y 4.0 significa nivel de cuarto grado.`;
      const st = join(plan.strengths.map(r => plan.L[r.id].esName), "y");
      const open = plan.strengths.length ? `Va bien en ${st}.` : `Está avanzando paso a paso.`;
      if (!plan.p1) return `${lvl} Va bien en todas las destrezas que medimos. Vamos a darle trabajo de mayor reto y volveremos a revisar su progreso el ${RECHECK.es}.`;
      return `${lvl} ${open} En las próximas tres semanas nos vamos a enfocar en ${plan.L[plan.p1.id].es}. En casa: ${plan.L[plan.p1.id].homeEs} Volveremos a revisar su progreso el ${RECHECK.es}.`;
    }
    const lvl = `${name}'s overall ${state.subject} level is ${ov}. On this scale, 3.0 means working at grade 3 standards and 4.0 means ready for grade 4.`;
    const st = join(plan.strengths.map(r => r.name.toLowerCase()), "and");
    const open = plan.strengths.length ? `Strong areas: ${st}.` : `Progress is building step by step.`;
    if (!plan.p1) return `${lvl} Every skill we measured is at grade level. We will add challenge work and check progress again on ${RECHECK.en}.`;
    return `${lvl} ${open} For the next three weeks our focus is ${plan.L[plan.p1.id].en}. At home: ${plan.L[plan.p1.id].homeEn} We will check progress again on ${RECHECK.en}.`;
  }
  function reteach(stds, rung) { return stds.filter(s => s.rung === rung && s.status === "remediate"); }
  function aiPayload(p, code, stds) {
    const ev = r => r ? ({ skill: r.name, ladder_rung: r.level, grade_level: r.gl, band: glWords(r.gl),
      standards_to_reteach: reteach(stds, r.id).map(s => s.code),
      evidence: r.lines.filter(l => l.counted).map(l => l.source === "Performance Matters"
        ? { source: l.source, items_right: l.right, items_total: l.total, grade_level: l.gl }
        : { source: l.source, result: l.detail.map(d => d.value).join(" / "), grade_level: l.gl }) }) : null;
    return JSON.stringify({
      student: code, grade: 3, subject: state.subject, overall_grade_level: p.overall.gl,
      priority_1: ev(p.p1), priority_2: ev(p.p2),
      strengths: p.rungs.filter(r => r.band === "ongrade" || r.band === "above").map(r => r.name),
      library_matches: p.p1 ? LIBRARY[p.p1.id].strategies : []
    }, null, 2);
  }
  function numberFacts(p, plan) {
    let n = 1;
    [p.p1, p.p2].forEach(r => { if (!r) return; n += 1 + r.lines.filter(l => l.counted).length; });
    return n + plan.strengths.length;
  }
  function planText(p, code, plan, stds) {
    const out = [`Action plan · ${SUBJ[state.subject]} · ${who(code, true)} · Grade 3`, `Overall level: ${gl(p.overall.gl)} (${glWords(p.overall.gl).toLowerCase()})`, `Suggested support tier: ${tierN(p) ? "Tier " + tierN(p) : "not enough evidence"}`];
    if (plan.p1) {
      const rt = reteach(stds, plan.p1.id);
      out.push("", `Priority 1: ${plan.p1.name}, level ${gl(plan.p1.gl)}`, `Evidence: ${evidenceSummary(plan.p1)}`,
        ...(rt.length ? [`Standards to reteach: ${rt.map(s => s.code + " " + s.label).join("; ")}`] : []),
        `Goal: ${LIBRARY[plan.p1.id].goal}`, ...LIBRARY[plan.p1.id].strategies.map(x => "- " + x), `Recheck: ${RECHECK.en}`);
    } else out.push("", `Every skill is at grade level. Plan enrichment and recheck on ${RECHECK.en}.`);
    if (plan.p2) out.push("", `Priority 2: ${plan.p2.name}, level ${gl(plan.p2.gl)}, starting about ${P2START}`, `- ${LIBRARY[plan.p2.id].strategies[0]}`);
    out.push("", `Strengths: ${plan.strengths.length ? plan.strengths.map(r => `${r.name} (${gl(r.gl)})`).join(", ") : "none yet outside the priorities"}`, "", `Family note: ${familyNote(plan, p, code, state.lang)}`);
    return out.join("\n");
  }

  function stdRow(s, withBasis) {
    const basis = s.status === "nottaught" ? s.basis.replace(/\d{4}-\d{2}-\d{2}/g, m => fmtDate(m)) : s.basis + (s.firstTaught ? " · taught " + fmtDate(s.firstTaught) : "");
    return `<div class="stdrow"><span class="mono small">${s.code}</span><span class="lbl">${esc(s.label)}</span><span class="st ${s.status}">${STATUS[s.status]}</span>${withBasis ? `<span class="basis">${esc(basis)}</span>` : ""}</div>`;
  }

  function viewStudent() {
    const code = state.code;
    const s = student(code);
    const p = profile(DATA, state.subject, code);
    const stds = standards(DATA, state.subject, code);
    const sel = p.rungs.find(r => r.id === state.rung) || p.p1 || p.rungs[p.rungs.length - 1];
    state.rung = sel.id;
    const plan = planFor(p);
    const key = code + ":" + state.subject;
    const approved = state.approvals[key];
    const rungsTopDown = [...p.rungs].reverse();
    const facts = numberFacts(p, plan);
    const order = ["remediate", "nocheck", "mastered", "nottaught"];
    const taught = stds.filter(x => x.taught);
    const mastered = taught.filter(x => x.status === "mastered").length;
    const x = g => `${(Math.min(g, 5) / 5) * 100}%`;
    const rt1 = plan.p1 ? reteach(stds, plan.p1.id) : [];
    return `<section class="view" aria-labelledby="tab-student">
      <div class="head">
        <div class="picker">
          <label class="small muted" for="pick">Student</label>
          <select id="pick">${DATA.students.map(st => `<option value="${st.code}" ${st.code === code ? "selected" : ""}>${st.code}${state.names ? " · " + esc(st.name) : ""}</option>`).join("")}</select>
          <button class="iconbtn" id="prev" aria-label="Previous student">←</button><button class="iconbtn" id="next" aria-label="Next student">→</button>
        </div>
        <span class="muted small">Grade 3 · ${SUBJ[state.subject]}</span>
      </div>
      <div class="panel overall">
        <div class="big b-${p.overall.band}">${gl(p.overall.gl)}<small>${glWords(p.overall.gl)}</small></div>
        <div style="display:grid;gap:8px;min-width:0">
          <h2>${state.names ? esc(s.name) + ` <span class="code">${code}</span>` : code}: overall ${state.subject} level</h2>
          ${s.ese ? `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span class="tag iep" style="margin:0">IEP</span><span class="small muted">${esc(s.ese.exceptionality)} · annual review ${fmtDate(s.ese.review)}</span><button class="btn ghost" data-tab="ese" style="padding:4px 12px;font-size:0.85rem">See IEP goal draft</button></div>` : ""}
          ${(t => t ? `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:baseline"><span class="tag tier t${t.n}">Tier ${t.n} · ${TIER_NAME[t.n]}</span><span class="small muted">Suggested support level: ${t.why}</span></div>` : "")(tierOf(p))}
          <div class="parts">${p.overall.parts.map(pt => `<div><span class="src">${esc(pt.source)}</span><span>${esc(pt.raw)}</span><span class="mono">→ ${gl(pt.gl)}</span></div>`).join("")}
            <div class="muted small">Overall is the average of the two whole-test results. Skill levels below add the detail.</div></div>
        </div>
      </div>
      <div class="split">
        <div class="panel" style="display:grid;gap:12px">
          <div class="head"><h3>Skill ladder</h3><span class="muted small">Foundation at the bottom</span></div>
          <div class="ladder" role="group" aria-label="Skill ladder">
            ${rungsTopDown.map(r => `<button class="rung" data-rung="${r.id}" aria-pressed="${r.id === sel.id}">
              <span class="lvl">${r.level}</span>
              <span class="body"><span class="nm">${esc(r.name)} ${r.tag ? `<span class="tag ${r.tag === "P1" ? "p1" : r.tag === "P2" ? "p2" : "wait"}">${r.tag === "Waits" ? "waits" : r.tag}</span>` : ""}</span>
                <span class="track"><i class="fill b-${r.band}" style="width:${r.gl == null ? 0 : x(r.gl)}"></i><b class="cut" style="left:${x(BANDS.support)}"></b><b class="cut g3" style="left:${x(3)}"></b><b class="cut" style="left:${x(4)}"></b></span></span>
              <span class="sc">${gl(r.gl)}<small>${glShort(r.gl)}</small></span></button>`).join("")}
          </div>
          <div class="axis" aria-hidden="true"><span></span><span class="sc-axis">${["K", "1", "2", "3", "4", "5"].map((t, i) => `<span class="${i === 3 ? "g3" : ""}" style="left:${i * 20}%">${t}</span>`).join("")}</span><span></span></div>
          <p class="foot-note">Bars show grade level from kindergarten to grade 5; the solid line is grade 3. Priority 1 is the lowest skill below grade level; Priority 2 is the next one up. Weak skills higher up wait.</p>
        </div>
        <div class="panel ev" aria-live="polite">
          <div class="head"><h3>Behind the level: ${esc(sel.name)}</h3></div>
          ${sel.lines.length ? sel.lines.map(evLine).join("") : `<p class="muted">No test in the loaded files measures this skill.</p>`}
          <div class="total b-${sel.band}"><span>Skill level${sel.lines.filter(l => l.counted).length > 1 ? `, average of ${sel.lines.filter(l => l.counted).length} sources` : ""}</span><span class="mono">${gl(sel.gl)} · ${glWords(sel.gl)}</span></div>
        </div>
      </div>

      <div class="panel" style="display:grid;gap:12px">
        <div class="head"><h3>Standards mastery · ${SUBJ[state.subject]}</h3><span class="muted small">${mastered} of ${taught.length} taught standards mastered · ${stds.length - taught.length} not taught yet</span></div>
        <div>${order.map(st => { const rows = stds.filter(z => z.status === st); return rows.length ? `<div class="stdgroup"><h4>${STATUS[st]} · ${rows.length}</h4><div class="stdlist">${rows.map(z => stdRow(z, true)).join("")}</div></div>` : ""; }).join("")}</div>
        <p class="foot-note">Mastered means at least ${Math.round(MASTERY.pct * 100)}% right on ${MASTERY.minItems} or more items for that benchmark. Not taught yet comes from the roadmap and the teacher's marks, so those standards never count against a student, even when a test included them.</p>
      </div>

      <div class="panel plan">
        <div class="status">
          <div style="display:grid;gap:4px"><h3>Action plan · ${SUBJ[state.subject]}</h3>
            <span class="muted small">Drafted by the local AI from the numbers above. In this demo the draft comes from a fixed template.</span></div>
          ${approved ? `<span class="pill ok">Approved by teacher · ${approved}</span>` : `<span class="pill draft">Draft · needs teacher approval</span>`}
        </div>
        ${plan.p1 ? `
        <div class="block"><span class="k">Priority 1 · start now</span>
          <h3>${esc(plan.p1.name)} <span class="muted mono small">level ${gl(plan.p1.gl)} · ${glWords(plan.p1.gl).toLowerCase()}</span></h3>
          <p class="small muted">Evidence: ${esc(evidenceSummary(plan.p1))}</p>
          ${rt1.length ? `<p class="small"><b>Standards to reteach:</b> ${rt1.map(z => `<span class="mono">${z.code}</span> ${esc(z.label)}`).join(" · ")}</p>` : ""}
          <p><b>Goal:</b> ${esc(LIBRARY[plan.p1.id].goal)}</p>
          <ul>${LIBRARY[plan.p1.id].strategies.map(z => `<li>${esc(z)}</li>`).join("")}</ul>
          <p class="small"><b>Recheck:</b> ${RECHECK.en}, three weeks from today.</p>
        </div>
        <div class="block"><span class="k">Intervention options · ${esc(plan.p1.name)}</span>
          ${(() => { const n = profiles().filter(x => x.p.p1 && x.p.p1.id === plan.p1.id).length; const r = shareReason(n, DATA.students.length); return formatBlock(plan.p1.id, r.f, r.why + (s.ese ? " Check the IEP service model for where this happens." : "")); })()}
        </div>` : `<div class="block"><span class="k">Priority 1</span><p>Every skill is at grade level. Plan enrichment and recheck on ${RECHECK.en}.</p></div>`}
        ${plan.p2 ? `
        <div class="block"><span class="k">Priority 2 · add once Priority 1 is under way, about ${P2START}</span>
          <h3>${esc(plan.p2.name)} <span class="muted mono small">level ${gl(plan.p2.gl)} · ${glWords(plan.p2.gl).toLowerCase()}</span></h3>
          <p class="small muted">Evidence: ${esc(evidenceSummary(plan.p2))}</p>
          <ul><li>${esc(LIBRARY[plan.p2.id].strategies[0])}</li></ul>
        </div>` : ""}
        <div class="block"><span class="k">Strengths to build on</span>
          <p>${plan.strengths.length ? plan.strengths.map(r => `${esc(r.name)} <span class="mono muted small">${gl(r.gl)}</span>`).join(" · ") : `<span class="muted">No skill outside the priorities is at grade level yet.</span>`}</p></div>
        <div class="block"><span class="k">Note for the family</span>
          <div class="family">
            <div class="seg" role="group" aria-label="Family note language" style="justify-self:start">
              <button id="lang-en" data-lang="en" aria-pressed="${state.lang === "en"}">English</button>
              <button id="lang-es" data-lang="es" aria-pressed="${state.lang === "es"}">Español</button></div>
            <p lang="${state.lang}">${esc(familyNote(plan, p, code, state.lang))}</p>
            ${state.names ? "" : `<p class="small muted">Names go back in only on the printed copy, from the name key on the Project Cerberus server.</p>`}
          </div></div>
        <div class="block">
          <p class="check">Number check passed: all ${facts} numbers in this plan match the database.</p>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
            <button class="btn" id="approve" ${approved ? "disabled" : ""}>${approved ? "Approved" : "Approve plan"}</button>
            ${approved ? `<button class="btn ghost" id="unapprove">Return to draft</button>` : ""}
            <button class="btn ghost" id="copy">Copy plan text</button>
          </div>
        </div>
        <details class="ai"><summary>What the local AI receives for this student</summary>
          <p class="small muted" style="margin-top:8px">Codes and computed grade levels only. No name, no birthday, no ID number. The model writes words; it does not do the math.</p>
          <pre>${esc(aiPayload(p, code, stds))}</pre></details>
      </div>
    </section>`;
  }
  function evLine(l) {
    if (l.source === "Performance Matters") {
      return `<div class="evline ${l.counted ? "" : "off"}">
        <div class="r"><span class="src">Performance Matters · item analysis</span><span class="pts">${l.right} of ${l.total} = ${l.pct}% → ${gl(l.gl)}</span></div>
        <div class="items">${l.items.map(it => `<div><span class="mono muted">#${it.n}</span><span class="mono small">${it.code}</span><span class="bm">${esc(it.label)}</span><span class="${it.correct ? "ok" : "no"}" aria-label="${it.correct ? "correct" : "incorrect"}">${it.correct ? "✓" : "✗"}</span></div>`).join("")}</div>
        <span class="muted small">${[...new Set(l.items.map(i => i.file))].join(" + ")}</span>
        ${l.counted ? "" : `<span class="small" style="color:var(--approaching);font-weight:600">Only ${l.total} item${l.total === 1 ? "" : "s"}, fewer than ${MIN_ITEMS}, so this line is not counted yet.</span>`}
      </div>`;
    }
    const isI = l.source === "i-Ready";
    return `<div class="evline">
      <div class="r"><span class="src">${isI ? "i-Ready · Diagnostic 1" : "FAST · PM1 reporting category"}</span><span class="pts">→ ${gl(l.gl)}</span></div>
      ${l.detail.map(d => `<div class="r small"><span>${esc(d.label)}</span><b>${esc(isI ? d.value : d.value + " the standard")}${isI ? ` <span class="mono muted">${gl(d.gl)}</span>` : ""}</b></div>`).join("")}
      ${isI && l.detail.length > 1 ? `<span class="muted small">Two domains, averaged into one i-Ready line.</span>` : ""}
    </div>`;
  }

  // ---------- STANDARDS (class) ----------
  function viewStandards() {

        <div class="stat"><span class="n">${taught.filter(x => x.nc.length).length}</span><span class="l">taught benchmarks with no check yet: plan a quick assessment</span></div>
      </div>
      <div class="legend"><span><span class="sw b-ongrade"></span>Mastered</span><span><span class="sw b-support"></span>Needs remediation</span><span><span class="sw b-none"></span>Taught, not checked yet</span></div>
      <div class="class-std">
        <h3 style="margin-bottom:10px">Taught so far · most remediation first</h3>
        ${taught.map(x => `<details>
          <summary><span class="mono small">${x.std.code}</span><span class="lbl">${esc(x.std.label)}</span>
            <span class="stackwrap" style="display:grid;gap:3px"><span class="stack" role="img" aria-label="${x.m.length} mastered, ${x.rm.length} need remediation, ${x.nc.length} not checked">
              <i class="seg-m mastered" style="width:${(x.m.length / n) * 100}%"></i><i class="seg-m support" style="width:${(x.rm.length / n) * 100}%"></i><i class="seg-m nocheck" style="width:${(x.nc.length / n) * 100}%"></i></span>
              <span class="stack-note">${x.nc.length === n ? "not checked yet" : `${x.m.length} mastered · ${x.rm.length} remediate${x.nc.length ? ` · ${x.nc.length} unchecked` : ""}`}</span></span>
            <span class="when">taught ${fmtDate(x.r0.firstTaught).replace(", 2026", "")}</span></summary>
          <div class="inside">
            ${x.std.rung && (x.rm.length || x.nc.length < n) ? (() => { const r = shareReason(x.rm.length, n); return x.rm.length ? `<div style="display:grid;gap:6px"><p class="small"><b>Reteach options</b></p>${formatBlock(x.std.rung, r.f, r.why)}</div>` : ""; })() : ""}
            ${x.rm.length ? `<div><p class="small" style="margin-bottom:6px"><b>Needs remediation (${x.rm.length})</b></p><div style="display:flex;flex-wrap:wrap;gap:6px">${x.rm.map(chip).join("")}</div></div>` : ""}
            ${x.m.length ? `<div><p class="small" style="margin-bottom:6px"><b>Mastered (${x.m.length})</b></p><div style="display:flex;flex-wrap:wrap;gap:6px">${x.m.map(chip).join("")}</div></div>` : ""}
            ${x.nc.length ? `<p class="small muted">No result yet for ${x.nc.length} student${x.nc.length > 1 ? "s" : ""}. ${x.nc[0].r.basis}.</p>` : ""}
